function scopeSeg(){return `<div class="seg" style="margin-bottom:10px"><button class="${dashScope==='current'?'active':''}" onclick="dashScope='current';renderDashBody()">รอบนี้</button><button class="${dashScope==='all'?'active':''}" onclick="dashScope='all';renderDashBody()">สะสมทั้งหมด (${histRounds.length+1} รอบ)</button></div>`;}
function renderDashBody(){const box=document.getElementById('dashBody');
  if(dashTab==='overview'){box.innerHTML=`<div class="card"><div class="sec-title">จำนวนคนที่จะมาทาน · พนักงานระดับ 4+ (คน)<span class="cap">วัน × คาบ · รวม ${REG_EMPS.length} คน</span><button class="share-ic save-ic" onclick="shareGrid('reg','save')" title="บันทึกเป็น JPG">💾</button><button class="share-ic" onclick="shareGrid('reg','share')" title="แชร์เป็นภาพ">📤</button></div>${gridFor(REG_EMPS,MEALS)}</div><div class="card"><div class="sec-title">จำนวนคนที่จะมาทาน · พนักงานรายวัน (ระดับ 3) (คน)<span class="cap">เฉพาะเที่ยง · รวม ${DAILY_EMPS.length} คน</span><button class="share-ic save-ic" onclick="shareGrid('daily','save')" title="บันทึกเป็น JPG">💾</button><button class="share-ic" onclick="shareGrid('daily','share')" title="แชร์เป็นภาพ">📤</button></div>${gridFor(DAILY_EMPS,MEALS.filter(m=>m[0]==='lunch'))}</div><div class="card"><div class="sec-title">สถานะการมาใช้สิทธิ์ของพนักงาน ระดับ 4+<span class="cap">รวม ${REG_EMPS.length} คน</span><button class="share-ic save-ic" onclick="shareStatusImage('reg','save')" title="บันทึกเป็น JPG">💾</button><button class="share-ic" onclick="shareStatusImage('reg','share')" title="แชร์เป็นภาพ">📤</button></div>${legendHTML()}${menuDays.map((day,di)=>statusRow(thDateISO(day.dateISO).dow.slice(0,2)+' '+thDateISO(day.dateISO).short,perDayPersonG(di,REG_EMPS))).join('')}</div><div class="card"><div class="sec-title">สถานะการมาใช้สิทธิ์ของพนักงาน รายวัน - ระดับ 3<span class="cap">รวม ${DAILY_EMPS.length} คน · เฉพาะเที่ยง</span><button class="share-ic save-ic" onclick="shareStatusImage('daily','save')" title="บันทึกเป็น JPG">💾</button><button class="share-ic" onclick="shareStatusImage('daily','share')" title="แชร์เป็นภาพ">📤</button></div>${legendHTML()}${menuDays.map((day,di)=>statusRow(thDateISO(day.dateISO).dow.slice(0,2)+' '+thDateISO(day.dateISO).short,perDayPersonG(di,DAILY_EMPS))).join('')}</div>`;}
  else if(dashTab==='menu'){const rows=aggMenuScope(dashScope),max=Math.max(...rows.map(r=>r.val),1);box.innerHTML=`${scopeSeg()}<div class="card"><div class="sec-title">เมนูยอดฮิต<span class="cap">จำนวนครั้งที่ถูกเลือกทาน · สะสม</span></div>${rows.map((r,i)=>`<div class="row-item"><span class="rank ${i===0?'top':''}">${i+1}</span><div style="width:36px;height:36px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-size:20px;overflow:hidden">${r.img?`<img src="${r.img}" style="width:100%;height:100%;object-fit:cover">`:r.emoji}</div><div style="flex:1"><div style="font-weight:600;font-size:13.5px">${r.label}</div><div style="color:var(--muted);font-size:11px;margin-top:2px">${mealLabel(r.meal)}</div><div style="height:7px;background:var(--line);border-radius:5px;margin-top:4px;overflow:hidden"><div style="height:100%;width:${r.val/max*100}%;background:var(--brand);border-radius:5px"></div></div></div><div style="font-weight:800">${r.val} <span style="font-weight:500;font-size:11px;color:var(--muted)">ครั้ง</span></div></div>`).join('')||'<div class="note">ยังไม่มีข้อมูล</div>'}</div>`;}
  else if(dashTab==='unit'){box.innerHTML=`<div class="seg" style="margin-bottom:10px"><button class="${dashUnitMode==='reg'?'active':''}" onclick="dashUnitMode='reg';renderDashBody()">ลงทะเบียน</button><button class="${dashUnitMode==='eat'?'active':''}" onclick="dashUnitMode='eat';renderDashBody()">ทาน</button></div><div class="search-wrap"><span class="ic">🔍</span><input id="unitQ" placeholder="ค้นหาหน่วยงาน" value="${unitQuery}" oninput="unitQuery=this.value;redrawUnit()"></div><div class="card"><div class="sec-title" id="unitTitle"></div><canvas id="ch" width="600" height="440" style="width:100%;height:auto"></canvas></div><div class="note" id="unitNote"></div>`;redrawUnit();}
  else if(dashTab==='actual'){let gE=0,gC=0;
    const dayCards=menuDays.map((day,di)=>{const d=thDateISO(day.dateISO);let dE=0,dC=0;
      const rows=MEALS.filter(m=>(day.meals[m[0]]||[]).length>0).map(m=>{const E=cellStat(di,m[0]).eat,C=ciGet(day.dateISO,m[0]);dE+=E;dC+=C;const pct=E?Math.round(C/E*100):0;
        return `<div class="row-item"><span style="font-size:19px">${m[2]}</span><div style="flex:1"><div style="font-weight:600;font-size:13.5px">${m[1]}</div><div style="font-size:12px;color:var(--muted)">ลงว่าทาน ${E} · มาสแกน ${C} คน</div></div><span class="pill ${pct>=85?'up':pct>=60?'':'no'}" style="${pct>=60&&pct<85?'background:var(--amber-l);color:var(--amber)':''}">${pct}%</span></div>`;}).join('');
      gE+=dE;gC+=dC;const dp=dE?Math.round(dC/dE*100):0;
      return `<div class="card"><div class="sec-title">${d.dow} ${d.short}<span class="cap">รวมวัน ${dC}/${dE} = ${dp}%</span></div>${rows||'<div class="note">ยังไม่มีเมนู</div>'}</div>`;}).join('');
    const gp=gE?Math.round(gC/gE*100):0;
    box.innerHTML=`<div class="hint">🧾 เทียบ "ลงทะเบียนว่าทาน" กับ "มาสแกน QR จริง" คาบต่อคาบ (รอบปัจจุบัน)</div>
    <div class="kpi-row"><div class="kpi"><div style="font-size:12px;color:var(--muted);font-weight:600">ลงว่าทาน (ทั้งรอบ)</div><div style="font-size:26px;font-weight:800;color:var(--brand)">${gE}</div></div><div class="kpi"><div style="font-size:12px;color:var(--muted);font-weight:600">มาใช้จริง (สแกน)</div><div style="font-size:26px;font-weight:800;color:${gp>=85?'var(--pos)':gp>=60?'var(--amber)':'var(--neg)'}">${gC} <span style="font-size:15px">(${gp}%)</span></div></div></div>
    ${dayCards}<div class="note">ข้อมูลสแกนมาจาก QR หน้าโรงอาหาร · เปิดสแกนตามช่วงเวลา: เช้า ${CI_WINDOWS.breakfast[0]}–${CI_WINDOWS.breakfast[1]} · เที่ยง ${CI_WINDOWS.lunch[0]}–${CI_WINDOWS.lunch[1]} · เย็น ${CI_WINDOWS.dinner[0]}–${CI_WINDOWS.dinner[1]} น.</div>`;}
  else{const rows=sortPersons(personStats());const mL={reg:'% ลงทะเบียน',eat:'% ทาน',no:'% ไม่ทาน'};const gL={all:'ทุกกลุ่ม',reg:'ระดับ 4+',daily:'รายวัน ระดับ 3'};box.innerHTML=`<div class="grp-pick"><span>👥 กลุ่ม</span><select onchange="dashPersonGroup=this.value;renderDashBody()"><option value="all"${dashPersonGroup==='all'?' selected':''}>ทุกกลุ่ม (${employees.length} คน)</option><option value="reg"${dashPersonGroup==='reg'?' selected':''}>ระดับ 4+ (${REG_EMPS.length} คน)</option><option value="daily"${dashPersonGroup==='daily'?' selected':''}>รายวัน ระดับ 3 (${DAILY_EMPS.length} คน)</option></select></div><div class="seg" style="margin-bottom:10px"><button class="${dashPersonMode==='reg'?'active':''}" onclick="dashPersonMode='reg';renderDashBody()">ลงทะเบียน</button><button class="${dashPersonMode==='eat'?'active':''}" onclick="dashPersonMode='eat';renderDashBody()">ทาน</button><button class="${dashPersonMode==='no'?'active':''}" onclick="dashPersonMode='no';renderDashBody()">ไม่ทาน</button></div><div class="search-wrap"><span class="ic">🔍</span><input placeholder="ค้นหาชื่อ/รหัส/หน่วยงาน" oninput="filterPerson(this.value)"></div><div class="card" id="pbox" style="padding:6px">${personRowsDash(rows.slice(0,25))}</div><div class="note">กลุ่ม ${gL[dashPersonGroup]} · รอบปัจจุบัน · % คิดจากคาบทั้งหมดที่มีสิทธิ์ (ระดับ4+ =${menuDays.length}วัน×3 · รายวัน =${menuDays.length}วัน×1) · เรียง${mL[dashPersonMode]}มาก→น้อย · แสดง ${Math.min(25,rows.length)} จาก ${rows.length} คน</div>`;}}
/* หน่วยงาน: คิดเป็น % */
function unitStats(scope){const info={};UNITS.forEach(u=>info[u]={total:0,reg:0,eat:0});employees.forEach(e=>{const inf=info[e.unit];if(!inf)return;inf.total++;let isReg=false,isEat=false;allDatasets(scope).forEach(d=>{const days=d.registrations[e.code]||{};Object.values(days).forEach(r=>MEALS.forEach(m=>{if(m[0] in r){isReg=true;if(r[m[0]])isEat=true;}}));});if(isReg)inf.reg++;if(isEat)inf.eat++;});return info;}
function redrawUnit(){const st=unitStats('all');let rows=Object.entries(st).map(([u,v])=>({label:u,total:v.total,reg:v.reg,eat:v.eat,val:dashUnitMode==='eat'?(v.reg?Math.round(v.eat/v.reg*100):0):(v.total?Math.round(v.reg/v.total*100):0)}));const q=(unitQuery||'').trim().toLowerCase();if(q)rows=rows.filter(r=>r.label.toLowerCase().includes(q));rows.sort((a,b)=>b.val-a.val||b.total-a.total);const shown=rows.slice(0,12);
  const t=document.getElementById('unitTitle');if(t)t.innerHTML=(dashUnitMode==='eat'?'% ทาน · จากคนที่ลงทะเบียนของหน่วย':'% ลงทะเบียน · จากคนทั้งหมดของหน่วย')+`<span class="cap">Top 12 · %</span>`;
  const n=document.getElementById('unitNote');if(n)n.textContent=`คิดจากข้อมูลทั้งหมดทุกรอบ · อ้างอิงคอลัมน์ L (หน่วย) · แสดง ${shown.length} จาก ${rows.length} หน่วยงาน${q?' (ผลค้นหา)':''}`;
  drawBars('ch',shown,v=>v+'%');}
/* รายคน (รอบปัจจุบัน): % คิดจาก "คาบทั้งหมดที่มีสิทธิ์" ของรอบ — ระดับ4+ =วันละ3คาบ · รายวัน =วันละ1(เที่ยง) */
function personGroupList(){return dashPersonGroup==='reg'?REG_EMPS:(dashPersonGroup==='daily'?DAILY_EMPS:employees);}
function personStats(){return personGroupList().map(e=>{let avail=0,reg=0,eatC=0,noC=0;menuDays.forEach((day,di)=>{empMeals(e).forEach(m=>{if(!(day.meals[m[0]]||[]).length)return;avail++;const r=(registrations[e.code]||{})[di];if(r&&(m[0] in r)){reg++;if(r[m[0]])eatC++;else noC++;}});});return{e,avail,reg,regPct:avail?Math.round(reg/avail*100):0,eatC,noC,eatPct:avail?Math.round(eatC/avail*100):0,noPct:avail?Math.round(noC/avail*100):0};});}
function sortPersons(rows){if(dashPersonMode==='eat')rows.sort((a,b)=>b.eatPct-a.eatPct||b.eatC-a.eatC);else if(dashPersonMode==='no')rows.sort((a,b)=>b.noPct-a.noPct||b.noC-a.noC);else rows.sort((a,b)=>b.regPct-a.regPct||b.reg-a.reg);return rows;}
function personPill(r){if(!r.avail)return `<span class="pill wait">ไม่มีคาบสิทธิ์</span>`;
  if(dashPersonMode==='eat')return `<span class="pill up">ทาน ${r.eatPct}% (${r.eatC}/${r.avail} คาบ)</span>`;
  if(dashPersonMode==='no')return `<span class="pill no">ไม่ทาน ${r.noPct}% (${r.noC}/${r.avail} คาบ)</span>`;
  /* ลงทะเบียน = ครบทั้งรอบเท่านั้น (1 รอบ = 1 ครั้ง) · ลงไม่ครบ = ข้อมูลเข้าไม่ครบ ควรให้ลงใหม่ */
  if(r.reg===0)return `<span class="pill wait">ยังไม่ลงทะเบียน</span>`;
  if(r.reg>=r.avail)return `<span class="pill up">ลงทะเบียนแล้ว ✓</span>`;
  return `<span class="pill" style="background:var(--neg-l);color:var(--neg)">⚠️ ลงไม่ครบ (${r.reg}/${r.avail}) · ให้ลงใหม่</span>`;}
function personRowsDash(rows){return rows.map(r=>`<div class="emp-item" style="cursor:default"><div style="flex:1"><div class="nm" style="font-size:15px">${r.e.name}</div><div class="dp">${r.e.code} · ${r.e.unit}</div></div>${personPill(r)}</div>`).join('');}
function personRows(rows){return rows.map(({e,reg})=>`<div class="emp-item" style="cursor:default"><div style="flex:1"><div class="nm" style="font-size:15px">${e.name}</div><div class="dp">${e.code} · ${e.unit}</div></div><span class="pill ${reg>0?'up':'wait'}">${reg>0?'ลงทะเบียน '+reg+' คาบ':'ยังไม่ลง'}</span></div>`).join('');}
function filterPerson(q){q=(q||'').toLowerCase();const rows=sortPersons(personStats()).filter(r=>r.e.code.includes(q)||r.e.name.toLowerCase().includes(q)||r.e.dept.toLowerCase().includes(q)||r.e.unit.toLowerCase().includes(q)).slice(0,30);document.getElementById('pbox').innerHTML=personRowsDash(rows);}
/* เมนูฮิต: สะสมข้ามรอบ (นับครั้งที่ถูกเลือก "ทาน") */
function aggMenuScope(scope){const map={};allDatasets(scope).forEach(d=>{d.menuDays.forEach((day,di)=>{MEALS.forEach(m=>{const items=day.meals[m[0]]||[];if(!items.length)return;let n=0;Object.values(d.registrations).forEach(days=>{const r=days[di];if(r&&r[m[0]])n++;});const key=items.map(x=>x.name).join(' / ');if(!map[key])map[key]={label:key,emoji:m[2],img:items[0].img,val:0,meal:m[0]};map[key].val+=n;});});});return Object.values(map).sort((a,b)=>b.val-a.val);}

const CLR=['#062F6E','#0A63B0','#00AEEF','#0ea5e9','#6366f1','#8b5cf6','#d97706','#dc2626'];
function drawBars(id,rows,fmt){fmt=fmt||(v=>v);const cv=document.getElementById(id);if(!cv)return;const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);if(!rows.length){ctx.fillStyle='#94a3b8';ctx.font="500 15px 'IBM Plex Sans Thai'";ctx.textAlign='center';ctx.fillText('ไม่พบหน่วยงาน',W/2,H/2);return;}ctx.textBaseline='middle';const max=Math.max(...rows.map(r=>r.val),1),labelW=150,left=labelW,right=W-56,top=12,gap=7,bh=(H-top*2-gap*(rows.length-1))/rows.length;rows.forEach((r,i)=>{const y=top+i*(bh+gap),w=(right-left)*(r.val/max);ctx.fillStyle='#334155';ctx.textAlign='right';ctx.font="600 12px 'IBM Plex Sans Thai','Sarabun'";const lbl=r.label.replace('แผนก','').replace('หน่วย','').replace('รักษา','');ctx.fillText(lbl.length>17?lbl.slice(0,16)+'…':lbl,labelW-8,y+bh/2);ctx.fillStyle='#eef2f6';rr(ctx,left,y,right-left,bh,6);ctx.fill();ctx.fillStyle=i===0?'#062F6E':'#00AEEF';rr(ctx,left,y,Math.max(w,3),bh,6);ctx.fill();ctx.fillStyle='#0f172a';ctx.textAlign='left';ctx.font="800 13px 'IBM Plex Sans Thai'";ctx.fillText(fmt(r.val),left+w+7,y+bh/2);});}
function drawLine(id,data){const cv=document.getElementById(id);if(!cv)return;const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);ctx.textBaseline='middle';const top=22,bot=H-38,left=46,right=W-18,max=Math.max(...data.map(d=>d.val),1)*1.2;ctx.strokeStyle='#eef2f6';ctx.fillStyle='#94a3b8';ctx.textAlign='right';ctx.font="500 12px 'IBM Plex Sans Thai'";for(let i=0;i<=4;i++){const y=top+(bot-top)*i/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();ctx.fillText(Math.round(max*(1-i/4)),left-8,y);}const n=data.length,xs=data.map((_,i)=>n>1?left+(right-left)*i/(n-1):(left+right)/2),ys=data.map(d=>bot-(bot-top)*(d.val/max));const g=ctx.createLinearGradient(0,top,0,bot);g.addColorStop(0,'rgba(6,47,110,.22)');g.addColorStop(1,'rgba(6,47,110,0)');ctx.beginPath();ctx.moveTo(xs[0],bot);xs.forEach((x,i)=>ctx.lineTo(x,ys[i]));ctx.lineTo(xs[n-1],bot);ctx.closePath();ctx.fillStyle=g;ctx.fill();ctx.beginPath();ctx.moveTo(xs[0],ys[0]);for(let i=1;i<n;i++)ctx.lineTo(xs[i],ys[i]);ctx.strokeStyle='#062F6E';ctx.lineWidth=3;ctx.stroke();ctx.textAlign='center';data.forEach((d,i)=>{ctx.beginPath();ctx.arc(xs[i],ys[i],5,0,7);ctx.fillStyle='#062F6E';ctx.fill();ctx.fillStyle='#0f172a';ctx.font="800 13px 'IBM Plex Sans Thai'";ctx.fillText(d.val,xs[i],ys[i]-15);ctx.fillStyle='#64748b';ctx.font="500 12px 'IBM Plex Sans Thai'";ctx.fillText(d.label,xs[i],bot+19);});}
function rr(ctx,x,y,w,h,r){r=Math.min(r,h/2,w/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function renderAdminData(){const rows=aggPerson();body().innerHTML=`<div class="hint">💡 กดปุ่มแล้วเลือกได้เลยว่าจะ <b>บันทึกลงเครื่อง 💾</b> หรือ <b>แชร์ไปไลน์/อีเมล 📤</b> · ไฟล์ .csv เปิดใน Microsoft Excel ได้ รองรับภาษาไทย</div>
  <button class="btn btn-brand" onclick="exportCSV()">📤 ไฟล์การลงทะเบียนรอบนี้ (Excel)</button>
  <button class="btn btn-ghost" style="margin-top:10px" onclick="exportNoReg()">🚫 รายชื่อคนไม่ลงทะเบียน (รอบที่ปิดแล้ว)</button>
  <button class="btn btn-ghost" style="margin-top:10px" onclick="exportFeedback()">💬 แชร์ข้อเสนอแนะ (${feedbackAll().length} รายการ)</button>
  <div class="card" style="margin-top:12px"><div class="sec-title">สรุปการลงทะเบียนรายคน<span class="cap">${rows.length} คน</span></div><div class="search-wrap"><span class="ic">🔍</span><input placeholder="ค้นหาชื่อ/รหัส/แผนก" oninput="filterData(this.value)"></div><div id="dbox">${personRows(rows.slice(0,20))}</div></div>`;}
function filterData(q){q=(q||'').toLowerCase();const rows=aggPerson().filter(({e})=>e.code.includes(q)||e.name.toLowerCase().includes(q)||e.dept.toLowerCase().includes(q)||e.unit.toLowerCase().includes(q)).slice(0,30);document.getElementById('dbox').innerHTML=personRows(rows);}
function exportCSV(){const head=['รหัสพนักงาน','ชื่อ-นามสกุล','หน่วยงาน','หน่วย','วันที่','คาบ','เมนู','สถานะ'];const lines=[head.join(',')];employees.forEach(e=>{const days=registrations[e.code]||{};menuDays.forEach((day,di)=>{const d=thDateISO(day.dateISO),r=days[di];availMealsFor(e,di).forEach(m=>{const status=!r?'ยังไม่ลงทะเบียน':(r[m[0]]?'ทาน':'ไม่ทาน');const menu=(day.meals[m[0]]||[]).map(x=>x.name).join(' / ');lines.push([e.code,e.name,e.dept,e.unit,`${d.dow} ${d.short}`,m[1],menu,status].map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','));});});});askExport('canteen-register.csv',lines,'ไฟล์การลงทะเบียน');}


/* รายชื่อพนักงานที่ "ไม่ได้ลงทะเบียนเลย" แยกตามรอบ (รอบปัจจุบัน + รอบย้อนหลังทั้งหมด) */
function roundLabel(ds){const days=(ds&&ds.menuDays)||[];if(!days.length)return '-';const a=thDateISO(days[0].dateISO),b=thDateISO(days[days.length-1].dateISO);return days.length>1?(a.short+' – '+b.short):a.short;}
function noRegRows(list){const lines=[['รอบ','รหัสพนักงาน','ชื่อพนักงาน','หน่วยงาน'].join(',')];let total=0;
  list.forEach(function(ds){const lbl=roundLabel(ds);const regs=ds.registrations||{};
    employees.forEach(function(e){const days=regs[e.code]||{};let n=0;
      Object.values(days).forEach(function(r){MEALS.forEach(function(m){if(m[0] in r)n++;});});
      /* นับเป็น 1 คนต่อ 1 รอบ ไม่แยกวัน/คาบ — ไม่ลงเลยทั้งรอบเท่านั้นจึงนับ */
      if(n===0){total++;lines.push([lbl,e.code,e.name,e.unit||e.dept||''].map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(','));}});});
  return{lines:lines,total:total};}

(function(){
  if(!('serviceWorker' in navigator))return;
  if(location.protocol!=='https:'&&location.hostname!=='localhost')return;
  var reloaded=false;
  var hadCtrl=!!navigator.serviceWorker.controller;   /* ครั้งแรกสุดไม่ต้องรีโหลด จะได้ไม่หน่วง */
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(reloaded||!hadCtrl)return;reloaded=true;location.reload();});
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if(reg.waiting)reg.waiting.postMessage('SKIP_WAITING');
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing;if(!nw)return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed'&&navigator.serviceWorker.controller)nw.postMessage('SKIP_WAITING');});});
      setInterval(function(){try{reg.update();}catch(e){}},60*60*1000);
    }).catch(function(e){console.warn('sw register failed',e);});
  });
})();
</script>
