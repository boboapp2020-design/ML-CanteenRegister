<!-- ===== OneSignal Web Push (แจ้งเตือนเด้งหน้าจอเหมือน LINE) =====
     ตั้ง service worker ของ OneSignal ไว้ในโฟลเดอร์ย่อย /onesignal/ แยก scope
     กันชนกับ sw.js เดิมของแอป (หนึ่ง scope มี SW ได้ตัวเดียว) -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal){
  try{
    /* path ของ SW ปรับตามโดเมนอัตโนมัติ: GitHub Pages เสิร์ฟใต้ /ML-CanteenRegister/, Cloudflare เสิร์ฟที่ราก */
    var OSP = (location.pathname.indexOf('/ML-CanteenRegister/')===0) ? 'ML-CanteenRegister/' : '';
    await OneSignal.init({
      appId: "e50edb91-4c00-44e6-ae2a-e0d3505d3720",
      safari_web_id: "web.onesignal.auto.43f3e2d2-3818-43ea-aa50-e469d0e1e106",
      serviceWorkerPath: OSP + "onesignal/OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/" + OSP + "onesignal/" },
      notifyButton: { enable: false }
    });
    if(typeof updateNotifBtn==='function')updateNotifBtn();
  }catch(e){console.warn('OneSignal init failed',e);}
});
</script>

<style>
  :root{
    color-scheme: only light;
    --brand:#062F6E; --brand2:#0A63B0; --brand-l:#cfe9fb; --brand-soft:#eff8ff; --sky:#00AEEF;
    --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff;
    --pos:#16a34a; --pos-l:#dcfce7; --neg:#dc2626; --neg-l:#fee2e2;
    --info:#0ea5e9; --info-l:#e0f2fe; --amber:#d97706; --amber-l:#fef3c7; --slate:#475569;
    --sh-sm:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.05);
    --sh:0 4px 16px rgba(15,23,42,.08); --sh-lg:0 18px 40px rgba(15,23,42,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{margin:0;height:100%;}
  body{font-family:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif;background:#dfe6ee;color:var(--ink);}
  .shell{max-width:520px;margin:0 auto;padding:18px 16px 40px;}
  .demo-head{text-align:center;margin-bottom:12px;}
  .demo-head h1{font-size:18px;margin:0;font-weight:700;color:var(--brand);}
  .demo-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px;}
  .stage{display:flex;justify-content:center;}
  .phone{width:392px;max-width:100%;background:#0b1220;border-radius:44px;padding:11px;box-shadow:var(--sh-lg);}
  .screen{background:var(--bg);border-radius:34px;overflow:hidden;height:788px;position:relative;display:flex;flex-direction:column;}
  .hdr{flex-shrink:0;min-height:58px;display:flex;align-items:center;gap:11px;padding:12px 15px;background:var(--card);border-bottom:1px solid var(--line);z-index:5;}
  .hdr.hdr-bottom{order:3;border-bottom:none;border-top:1px solid var(--line);}
  .hdr .nav{background:var(--bg);border:1px solid var(--line);border-radius:11px;width:38px;height:38px;font-size:19px;cursor:pointer;color:var(--ink2);display:grid;place-items:center;flex-shrink:0;}
  .hdr .title{font-weight:700;font-size:17px;}
  .hdr .bm{width:42px;height:42px;border-radius:11px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex-shrink:0;} .hdr .bm img{width:100%;height:100%;object-fit:contain;padding:3px;}
  .hdr .bt{font-weight:700;font-size:15.5px;line-height:1.15;} .hdr .bs{color:var(--muted);font-size:11.5px;}
  .app-body{flex:1;overflow-y:auto;padding:18px 16px 22px;-webkit-overflow-scrolling:touch;}
  .app-body.center{display:flex;flex-direction:column;justify-content:center;}
  .app-body::-webkit-scrollbar{width:0;}
  @media(max-width:640px){
    body{background:var(--bg);} .shell{padding:0;max-width:100%;} .demo-head,.caption{display:none;}
    .phone{padding:0;border-radius:0;width:100%;box-shadow:none;} .screen{border-radius:0;height:100vh;height:100dvh;}
  }
  /* ติดตั้งเป็นแอป (มือถือ/แท็บเล็ตทุกขนาดจอ) = เต็มจอเสมอ */
  @media(display-mode:standalone),(display-mode:fullscreen){
    body{background:var(--bg);} .shell{padding:0;max-width:100%;} .demo-head,.caption{display:none;}
    .phone{padding:0;border-radius:0;width:100%;box-shadow:none;} .screen{border-radius:0;height:100vh;height:100dvh;max-width:640px;margin:0 auto;}
  }

  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--sh-sm);margin-bottom:12px;}
  .btn{width:100%;border:none;border-radius:13px;padding:17px;font-family:inherit;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:.12s;}
  .btn:active{transform:scale(.985);}
  .btn-brand{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(6,47,110,.28);}
  .btn-pos{background:var(--pos);color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.26);}
  .btn-neg{background:#fff;color:var(--neg);border:2px solid var(--neg);}
  .btn-ghost{background:#fff;color:var(--ink2);border:1px solid var(--line);font-size:16px;padding:14px;box-shadow:var(--sh-sm);}
  .btn+.btn{margin-top:10px;}

  .hub-btn{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px 14px;font-family:inherit;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:11px;font-size:15.5px;margin-bottom:8px;transition:.12s;text-align:left;background:var(--card);color:var(--ink);box-shadow:var(--sh-sm);}
  .hub-btn:active{transform:scale(.985);}
  .hub-btn .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex-shrink:0;}
  .hub-btn small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px;line-height:1.3;}
  .hub-primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 8px 20px rgba(6,47,110,.28);}
  .hub-primary small{color:rgba(255,255,255,.82);} .hub-primary .ic{background:rgba(255,255,255,.16);}
  .ic-blue{background:var(--info-l);color:var(--info);} .ic-slate{background:#f1f5f9;color:var(--slate);} .ic-amber{background:var(--amber-l);color:var(--amber);} .ic-red{background:var(--neg-l);color:var(--neg);}
  .hub-danger{border-color:var(--neg-l);} .hub-danger small{color:var(--neg);opacity:.85;}

  .search-wrap{position:relative;margin-bottom:12px;}
  .search-wrap input{width:100%;padding:15px 15px 15px 46px;font-size:17px;font-family:inherit;border:1px solid var(--line);border-radius:13px;outline:none;font-weight:500;background:#fff;box-shadow:var(--sh-sm);}
  .search-wrap input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--brand-l);}
  .search-wrap .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.6;}
  .emp-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent;}
  .emp-item:hover{background:var(--brand-soft);border-color:var(--brand-l);}
  .avatar{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:17px;flex-shrink:0;border:1px solid var(--brand-l);}
  .emp-item .nm{font-weight:600;font-size:16px;} .emp-item .dp{color:var(--muted);font-size:13px;}
  .code-badge{background:var(--ink);color:#fff;font-weight:700;padding:5px 10px;border-radius:9px;font-size:14px;}

  .pin-dots{display:flex;justify-content:center;gap:15px;margin:12px 0 6px;}
  .pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);}
  .pin-dots span.on{background:var(--brand);border-color:var(--brand);}
  .code-display{text-align:center;font-size:36px;font-weight:700;letter-spacing:8px;min-height:48px;margin:8px 0 10px;}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .keypad button{padding:17px;font-size:24px;font-weight:700;font-family:inherit;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;box-shadow:var(--sh-sm);color:var(--ink);}
  .keypad button:active{background:var(--brand-soft);}
  .keypad button.act{background:var(--brand);color:#fff;font-size:16px;border-color:var(--brand);}

  .hero{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);}
  .hero .n{font-size:20px;font-weight:700;} .hero .meta{font-size:13px;opacity:.85;margin-top:3px;}
  .progress{display:flex;gap:5px;margin-bottom:12px;}
  .progress span{flex:1;height:6px;border-radius:4px;background:var(--line);}
  .progress span.on{background:var(--brand);} .progress span.cur{background:var(--amber);}
  .datehdr{text-align:center;margin-bottom:12px;}
  .datehdr .big{font-size:23px;font-weight:700;} .datehdr .sub{color:var(--muted);font-size:14px;}

  .meal-card{padding:14px;}
  .meal-head{display:flex;align-items:center;gap:11px;}
  .meal-ic{width:40px;height:40px;border-radius:11px;background:var(--bg);display:grid;place-items:center;font-size:21px;flex-shrink:0;}
  .meal-head .mn{font-weight:600;font-size:12.5px;color:var(--muted);letter-spacing:.2px;} .meal-head .items{color:var(--ink);font-size:19px;font-weight:800;margin-top:1px;line-height:1.35;}
  .thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;cursor:pointer;border:1px solid var(--line);flex-shrink:0;position:relative;}
  .thumb-wrap{position:relative;flex-shrink:0;}
  .thumb-wrap .zoom{position:absolute;right:2px;bottom:2px;background:rgba(15,23,42,.72);color:#fff;font-size:9px;padding:1px 4px;border-radius:5px;pointer-events:none;}
  .choice{display:flex;gap:10px;margin-top:12px;}
  .ch{flex:1;border:2px solid var(--line);background:#fff;border-radius:11px;padding:11px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;transition:.1s;}
  .ch-yes{background:#fff;color:#15803d;border-color:var(--pos);} .ch-no{background:#fff;color:var(--neg);border-color:var(--neg);}
  .ch:active{transform:scale(.97);}
  .ch-yes.sel{background:var(--pos);color:#fff;border-color:var(--pos);box-shadow:0 4px 12px rgba(22,163,74,.3);} .ch-no.sel{background:var(--neg);color:#fff;border-color:var(--neg);box-shadow:0 4px 12px rgba(220,38,38,.28);}
  .divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;font-weight:600;margin:14px 2px 12px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}

  .menu-photo{width:100%;height:130px;border-radius:12px;display:grid;place-items:center;font-size:56px;margin-bottom:12px;background:var(--brand-soft);overflow:hidden;border:1px solid var(--brand-l);}
  .menu-photo img{width:100%;height:100%;object-fit:cover;}
  .done-check{width:92px;height:92px;border-radius:50%;background:var(--pos-l);color:var(--pos);display:grid;place-items:center;font-size:50px;margin:12px auto;}
  .toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:var(--sh-lg);}
  .toast.show{opacity:1;bottom:34px;}
  .modal-ov{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(2,6,23,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:26px;}
  .modal-bx{background:#fff;border-radius:20px;padding:24px 20px 18px;max-width:330px;width:100%;text-align:center;box-shadow:var(--sh-lg);animation:popIn .18s ease;}
  @keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-bx .mi{font-size:46px;margin-bottom:8px;}
  .modal-bx .mt{font-weight:800;font-size:17.5px;color:var(--ink);margin-bottom:6px;}
  .modal-bx .mm{color:var(--muted);font-size:14px;line-height:1.75;margin-bottom:16px;}
  .modal-bx .pin-inp{width:150px;margin:0 auto 14px;display:block;text-align:center;font-size:24px;letter-spacing:10px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:10px 4px;outline:none;}
  .modal-bx .pin-inp:focus{border-color:var(--brand2);}
  .lightbox{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(2,6,23,.9);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;cursor:zoom-out;}
  .lightbox img{max-width:100%;max-height:78%;border-radius:14px;box-shadow:var(--sh-lg);}
  .lightbox .lb-close{color:#fff;font-weight:600;font-size:14px;background:rgba(255,255,255,.14);padding:9px 16px;border-radius:10px;}

  .kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--sh-sm);}
  .kpi .v{font-size:25px;font-weight:800;line-height:1;} .kpi .l{color:var(--muted);font-size:12px;font-weight:500;margin-top:5px;} .kpi .sub{font-size:11px;font-weight:600;margin-top:4px;}
  .kpi.g .v{color:var(--brand);} .kpi.b .v{color:var(--info);} .kpi.a .v{color:var(--amber);} .kpi.n .v{color:var(--ink);}
  .sec-title{font-size:15px;font-weight:700;margin:2px 2px 10px;display:flex;align-items:center;gap:7px;}
  .sec-title .cap{color:var(--muted);font-weight:500;font-size:12px;margin-left:auto;}
  .share-ic{width:36px;height:36px;flex-shrink:0;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:16px;cursor:pointer;font-family:inherit;box-shadow:var(--sh-sm);margin-left:8px;}
  .save-ic{background:var(--pos);}
  .period{display:inline-flex;align-items:center;gap:6px;background:var(--info-l);color:#075985;font-weight:600;font-size:12px;padding:6px 11px;border-radius:8px;margin-bottom:12px;}
  .dash-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .rfr-btn{margin-left:auto;border:1px solid var(--info);background:var(--info-l);color:#075985;font-family:inherit;font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;}
  .rfr-btn:active{transform:scale(.96);}
  .dash-upd{font-size:11px;color:var(--muted);margin-bottom:12px;padding-left:2px;}
  .row-item{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line);}
  .row-item:last-child{border-bottom:none;}
  .stack-click{transition:background .12s;border-radius:8px;padding:10px 6px;margin:0 -4px;} .stack-click:active{background:var(--brand-soft);}
  .pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:7px;}
  .pill.up{background:var(--pos-l);color:#15803d;} .pill.no{background:var(--neg-l);color:var(--neg);} .pill.wait{background:#f1f5f9;color:var(--muted);}
  .rank{width:25px;height:25px;border-radius:8px;background:var(--bg);color:var(--slate);font-weight:800;font-size:13px;display:grid;place-items:center;flex-shrink:0;}
  .rank.top{background:var(--amber-l);color:var(--amber);}
  label.fld{display:block;font-weight:600;font-size:14px;margin:12px 2px 6px;color:var(--ink2);}
  input.txt,select.txt{width:100%;padding:13px;font-size:16px;font-family:inherit;border:1px solid var(--line);border-radius:12px;outline:none;font-weight:500;background:#fff;}
  input.txt:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--brand-l);}
  .img-drop{border:1.5px dashed var(--brand2);border-radius:13px;padding:16px;text-align:center;color:var(--brand);font-weight:600;cursor:pointer;background:var(--brand-soft);font-size:14px;}
  .img-preview{width:100%;height:120px;object-fit:cover;border-radius:12px;margin-top:10px;}
  .chips{display:flex;gap:8px;} .chips button{flex:1;border:1px solid var(--line);background:#fff;padding:11px 6px;border-radius:12px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);line-height:1.25;}
  .chips button.active{background:var(--brand);color:#fff;border-color:var(--brand);} .chips button:disabled{cursor:not-allowed;} .chips.day button.active{background:var(--info);border-color:var(--info);}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px;box-shadow:var(--sh-sm);}
  .grp-pick{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .grp-pick span{font-size:13.5px;font-weight:700;color:var(--ink2);}
  .grp-pick select{flex:1;font-family:inherit;font-size:14.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);border:1px solid var(--brand);border-radius:11px;padding:11px 12px;cursor:pointer;-webkit-appearance:menulist;appearance:menulist;}
  .seg button{flex:1;border:none;background:none;font-family:inherit;padding:9px 4px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;} .seg button.active{background:var(--brand);color:#fff;}
  .menu-manage{display:flex;align-items:center;gap:11px;padding:9px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;}
  .menu-manage .em{width:44px;height:44px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex-shrink:0;overflow:hidden;cursor:pointer;} .menu-manage .em img{width:100%;height:100%;object-fit:cover;}
  .hint{background:var(--info-l);color:#075985;padding:11px 13px;border-radius:12px;font-size:12.5px;font-weight:500;margin-bottom:12px;line-height:1.5;}
  .hide{display:none!important;} .caption{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;}
  .del{color:var(--neg);background:none;border:none;font-size:18px;cursor:pointer;padding:4px 7px;} .note{color:var(--muted);font-size:12px;text-align:center;padding:8px;} .home-name{font-size:17.5px;font-weight:800;line-height:1.2;color:var(--brand);letter-spacing:-.3px;} .home-co{font-size:13px;color:var(--muted);margin-top:5px;font-weight:600;}
  .admin-link{display:block;margin:10px auto 0;background:none;border:none;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;opacity:.75;text-decoration:underline;}
  .fb-q{padding:13px 2px;border-bottom:1px solid var(--line);} .fb-q:last-child{border-bottom:none;}
  .fb-qh{font-weight:700;font-size:15px;text-align:center;}

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.

let EMP_ADD=[],EMP_DEL=[];
try{EMP_ADD=JSON.parse(localStorage.getItem('canteen_emp_add')||'[]');EMP_DEL=JSON.parse(localStorage.getItem('canteen_emp_del')||'[]');}catch(e){}
function saveEmpEdits(){try{localStorage.setItem('canteen_emp_add',JSON.stringify(EMP_ADD));localStorage.setItem('canteen_emp_del',JSON.stringify(EMP_DEL));}catch(e){}}
let employees=[],REG_EMPS=[],DAILY_EMPS=[],DEPTS=[],UNITS=[];
function buildEmployees(){
  employees=EMP_RAW.map(r=>({code:r[0],name:r[1],dept:r[2],unit:r[3],daily:false}))
    .concat(DAILY_RAW.map(r=>({code:r[0],name:r[1],dept:r[2]||'พนักงานรายวัน',unit:r[2]||'พนักงานรายวัน',daily:true})))
    .filter(e=>!EMP_DEL.includes(e.code))
    .concat(EMP_ADD.map(a=>({code:a.code,name:a.name,dept:a.dept,unit:a.unit,daily:!!a.daily})));
  REG_EMPS=employees.filter(e=>!e.daily);DAILY_EMPS=employees.filter(e=>e.daily);
  DEPTS=[...new Set(employees.map(e=>e.dept))];
  UNITS=[...new Set(employees.map(e=>e.unit))];
}
buildEmployees();
/* พนักงานรายวัน (ระดับ 3) ใช้สิทธิ์ได้เฉพาะคาบเที่ยง */
function empMeals(e){return e&&e.daily?MEALS.filter(m=>m[0]==='lunch'):MEALS;}
function availMealsFor(e,di){return empMeals(e).filter(m=>(menuDays[di].meals[m[0]]||[]).length>0);}
/* วันหยุด: เก็บเป็น "มื้อพิเศษ" key holiday ในเมนูของวันนั้น (ใช้ที่เก็บเดิม ไม่ต้องแก้ชีต) — วันนี้จะถูกข้ามทุกที่ */
function isHoliday(di){const d=menuDays[di];return !!(d&&d.meals&&(d.meals.holiday||[]).length);}
const MEALS=[['breakfast','คาบเช้า','☀️'],['lunch','คาบเที่ยง','🍽️'],['dinner','คาบเย็น','🌙']];
const THMON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THDOW=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
function ymd(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d;}
function thDateISO(iso){const d=new Date(iso+'T00:00:00');return{dow:THDOW[d.getDay()],short:d.getDate()+' '+THMON[d.getMonth()],ymd:(d.getFullYear()+543)};}
let rounds=3, startDate=ymd(addDays(ymd(new Date()),1));
/* ปิดลงทะเบียน 23:59 น. (เวลาไทย) ของวันก่อนวันเริ่มรอบ */
/* ปิดลงทะเบียน 17:00 น. (เวลาไทย) ของวันก่อนวันเริ่มรอบ
   ยกเว้นครั้งเดียว: รอบเริ่ม 10 ส.ค. 2026 ขยายปิดรับถึง 10 ส.ค. 2026 เวลา 23:59 น.
   ใช้ค่าที่ช้ากว่าเสมอ จึงหมดอายุตัวเองอัตโนมัติ — รอบถัดไปกลับมาใช้กติกาปกติ (17:00 ของวันก่อนเริ่มรอบ) */
const REG_DL_ONCE=new Date('2026-08-12T18:00:00+07:00').getTime();
/* เวลาปิดรับที่แอดมินตั้งเอง/ระบบบันทึกไว้ใน Config (ISO) — ถ้ามีให้ใช้ค่านี้ตรง ๆ แทนค่าที่คำนวณ */
let regDeadlineISO='';
function regCutoff(){var t=regDeadlineISO?Date.parse(regDeadlineISO):NaN;if(!isNaN(t))return t;const base=new Date(startDate+'T00:00:00+07:00').getTime()-7*3600*1000;return Math.max(base,REG_DL_ONCE);}
function regOpen(){return Date.now()<regCutoff();}
function thStampTH(ms){const d=new Date(ms+7*3600*1000);const p=n=>String(n).padStart(2,'0');return{dow:THDOW[d.getUTCDay()],short:d.getUTCDate()+' '+THMON[d.getUTCMonth()],time:p(d.getUTCHours())+':'+p(d.getUTCMinutes())};}
function regDlText(){const c=thStampTH(regCutoff());return c.dow+' '+c.short+' เวลา '+c.time+' น.';}
function periodLabel(){const a=thDateISO(menuDays[0].dateISO),b=thDateISO(menuDays[menuDays.length-1].dateISO);return `งวด ${a.short} – ${b.short} ${b.ymd}`;}
function rebuildDays(){const old=menuDays||[];const arr=[];for(let i=0;i<rounds;i++){arr.push({dateISO:ymd(addDays(startDate,i)),meals:(old[i]&&old[i].meals)?old[i].meals:{breakfast:[],lunch:[],dinner:[]}});}menuDays=arr;}

function seedHistory(){histRounds=[];const s=ymd(addDays(startDate,-4));const md=JSON.parse(JSON.stringify(menuDays)).map((d,i)=>({dateISO:ymd(addDays(s,i)),meals:d.meals}));const regs={};employees.forEach((e,i)=>{if(i%5===4)return;regs[e.code]={};md.forEach((_,di)=>{if((i*3+di*7)%10<9)regs[e.code][di]=e.daily?{lunch:((i*2+di)%5)!==0}:{breakfast:((i+di)%4)!==0,lunch:((i*2+di)%5)!==0,dinner:((i+di)%3)!==0};});});histRounds.push({startDate:s,rounds:md.length,menuDays:md,registrations:regs});}

/* ===== Google Sheets backend sync (optional) =====
   ใส่ URL ของ Google Apps Script Web App ที่นี่ (ลงท้ายด้วย /exec)
   ถ้าปล่อยว่าง แอปจะทำงานแบบ demo (ข้อมูลอยู่ในเครื่องเท่านั้น ไม่ sync ข้ามอุปกรณ์) */
const API_URL = 'https://script.google.com/macros/s/AKfycbzFXgTliQIklmbnypdoAQTJ4q_NTRqjhAQKZvK6fwqbzOChR3a_POURzGhPRqxlBK9T/exec';
function apiEnabled(){return !!API_URL;}
/* มีตัวตัดเวลา: บนเน็ตช้า ถ้าโหลดเกิน 12 วิ จะ reject เพื่อให้ boot ไปใช้ข้อมูลแคช/ตัวอย่าง แทนค้างจอ */
function apiGetState(){
  var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  var timer=setTimeout(function(){try{ctrl&&ctrl.abort();}catch(e){}},12000);
  return fetch(API_URL+'?action=state',{cache:'no-store',signal:ctrl?ctrl.signal:undefined})
    .then(function(r){clearTimeout(timer);return r.json();},function(err){clearTimeout(timer);throw err;});
}
function apiPostRaw(action,data){if(!apiEnabled())return Promise.resolve({ok:true});
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action},data))})
    .then(r=>r.json()).catch(err=>{console.warn('sync failed',err);toast('⚠️ ซิงก์ข้อมูลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต');return{ok:false,error:String(err)};});}
/* ส่งคำสั่งเขียนทีละคำสั่งเรียงตามลำดับเสมอ
   กันเคส "เริ่มรอบใหม่" (ซึ่งล้างตารางเมนูฝั่งเซิร์ฟเวอร์) วิ่งไปลบเมนูวันแรกที่แอดมินเพิ่งพิมพ์เข้าไปทับ */
let apiChain=Promise.resolve();
function apiPost(action,data){
  const run=function(){return apiPostRaw(action,data);};
  const p=apiChain.then(run,run);
  /* ถ้าคำสั่งไหนค้างนานผิดปกติ ปล่อยคิวเดินต่อ จะได้ไม่ล็อกทั้งแอป */
  apiChain=Promise.race([p.catch(function(){}),new Promise(function(r){setTimeout(r,20000);})]);
  return p;}
/* ===== กันเมนูหาย (v4.1) =====
   ปัญหาเดิม: กดเพิ่มเมนูแล้วแอปส่งขึ้นเซิร์ฟเวอร์ "ครั้งเดียว" โดยไม่เช็คว่าสำเร็จ
   ถ้าเน็ตสะดุด/เซิร์ฟเวอร์ติดล็อกชั่วคราว/ปิดแอปเร็ว เมนูมื้อนั้นจะหายเงียบ ๆ
   วิธีแก้: จดทุกมื้อที่ต้องบันทึกลง "คิวค้างส่ง" ในเครื่องก่อน แล้วส่งซ้ำจนกว่าเซิร์ฟเวอร์ตอบ ok จริง
   ปิดแอปไปเปิดใหม่ คิวก็ยังอยู่ ส่งต่อให้จนครบ */
const LS_MOUT='canteen_menu_outbox';
let menuOutbox={},moBusy=false;
function moLoad(){try{menuOutbox=JSON.parse(localStorage.getItem(LS_MOUT)||'{}')||{};}catch(e){menuOutbox={};}}
function moSave(){try{localStorage.setItem(LS_MOUT,JSON.stringify(menuOutbox));}catch(e){
  try{const c={};Object.keys(menuOutbox).forEach(function(k){const j=menuOutbox[k];c[k]={dayIndex:j.dayIndex,dateISO:j.dateISO,mealKey:j.mealKey,items:(j.items||[]).map(function(x){return{name:x.name,emoji:x.emoji,img:null};})};});localStorage.setItem(LS_MOUT,JSON.stringify(c));}catch(e2){}}}
function moCount(){return Object.keys(menuOutbox).length;}
function moBadge(){const el=document.getElementById('moStat');if(!el)return;
  el.innerHTML=moCount()===0?'☁️ บันทึกขึ้นเซิร์ฟเวอร์ครบทุกมื้อแล้ว ✓':'⏳ กำลังบันทึกขึ้นเซิร์ฟเวอร์... เหลือ '+moCount()+' มื้อ (ส่งซ้ำอัตโนมัติจนสำเร็จ)';
  el.style.color=moCount()===0?'var(--pos)':'var(--amber)';}
function queueMenuSave(di,mk){const d=menuDays[di];if(!d)return;
  menuOutbox[di+'|'+mk]={dayIndex:di,dateISO:d.dateISO,mealKey:mk,items:d.meals[mk]||[]};
  moSave();moBadge();moFlush();}
function moFlush(){
  if(moBusy||!apiEnabled())return;
  const keys=Object.keys(menuOutbox);if(!keys.length){moBadge();return;}
  moBusy=true;const k=keys[0],job=menuOutbox[k];
  apiPost('saveMenuDay',{dayIndex:job.dayIndex,dateISO:job.dateISO,mealKey:job.mealKey,items:job.items}).then(function(res){
    moBusy=false;
    if(res&&res.ok){if(menuOutbox[k]===job){delete menuOutbox[k];moSave();}moBadge();moFlush();}
    else{moBadge();setTimeout(moFlush,4000);}
  },function(){moBusy=false;moBadge();setTimeout(moFlush,4000);});}
setInterval(moFlush,15000);
try{window.addEventListener('online',moFlush);}catch(e){}
/* ตรวจทานกับเซิร์ฟเวอร์: เทียบเมนูในเครื่องกับของจริง มื้อไหนขาด ส่งซ้ำทันที */
function menuSig(items){return JSON.stringify((items||[]).map(function(x){return x.name;}));}
function verifyMenus(){return apiGetState().then(function(st){const sm=st.menu||{};let miss=0;
  menuDays.forEach(function(d,di){MEALS.forEach(function(m){const mk=m[0];
    const srv=((sm[di]||sm[String(di)])||{})[mk]||[];
    if(menuSig(srv)!==menuSig(d.meals[mk])){miss++;queueMenuSave(di,mk);}});});
  return miss;});}
function whenOutboxEmpty(cb,tries){if(moCount()===0)return cb();if((tries||0)>40)return cb();setTimeout(function(){whenOutboxEmpty(cb,(tries||0)+1);},500);}
function emptyMenuDays(){const arr=[];for(let i=0;i<rounds;i++)arr.push({dateISO:ymd(addDays(startDate,i)),meals:{breakfast:[],lunch:[],dinner:[]}});return arr;}
/* Google Sheet อาจแปลงช่องวันที่เป็น Date object — แปลงกลับเป็น YYYY-MM-DD เสมอ */
function isoDateStr(v){if(!v)return '';const s=String(v);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);if(isNaN(d.getTime()))return '';const b=new Date(d.getTime()+7*3600*1000);const p=n=>String(n).padStart(2,'0');return b.getUTCFullYear()+'-'+p(b.getUTCMonth()+1)+'-'+p(b.getUTCDate());}
/* แคชข้อมูลล่าสุดไว้ในเครื่อง เพื่อให้เปิดแอปแล้วเห็นเมนูทันที ไม่ต้องรอเน็ต */
const LS_STATE='canteen_state_cache';
function stripImgs(st){try{const c=JSON.parse(JSON.stringify(st));
  const rm=function(menu){Object.keys(menu||{}).forEach(function(di){Object.keys(menu[di]||{}).forEach(function(mk){(menu[di][mk]||[]).forEach(function(it){if(it&&it.img)delete it.img;});});});};
  rm(c.menu);(c.history||[]).forEach(function(h){rm(h.menu);});return c;}catch(e){return st;}}
function saveStateCache(st){try{localStorage.setItem(LS_STATE,JSON.stringify(st));}catch(e){try{localStorage.setItem(LS_STATE,JSON.stringify(stripImgs(st)));}catch(e2){}}}
function loadStateCache(){try{const s=localStorage.getItem(LS_STATE);return s?JSON.parse(s):null;}catch(e){return null;}}
function applyStateFromAPI(st){rounds=st.rounds||rounds;startDate=isoDateStr(st.startDate)||startDate;
  regGen=(st.regGen===undefined||st.regGen===null)?regGen:(Number(st.regGen)||0);
  regDeadlineISO=(st.regDeadline===undefined||st.regDeadline===null)?'':String(st.regDeadline||'');
  menuDays=emptyMenuDays();menuExtra=[];
  const menu=st.menu||{};
  /* dayIndex ที่เกินจำนวนวันของรอบ ไม่ทิ้ง — เก็บใส่ menuExtra ไว้โชว์ในหน้าเมนู (คำนวณวันที่จาก startDate + dayIndex) */
  const _xtra={};
  const _pushX=function(base,d,mk,items){const k=ymd(addDays(base,d));if(!_xtra[k])_xtra[k]={dateISO:k,meals:{breakfast:[],lunch:[],dinner:[]}};_xtra[k].meals[mk]=items||[];};
  Object.keys(menu).forEach(di=>{const d=Number(di);
    if(!menuDays[d]){if(isFinite(d)&&d>=0&&d<400)Object.keys(menu[di]).forEach(mk=>{_pushX(startDate,d,mk,menu[di][mk]);});return;}
    Object.keys(menu[di]).forEach(mk=>{menuDays[d].meals[mk]=menu[di][mk]||[];});});
  menuReady=Object.keys(menu).length>0;
  menuPublished=(st.menuPub===undefined||st.menuPub===null||st.menuPub==='')?true:!!Number(st.menuPub);
  registrations={};
  const regs=st.registrations||{};
  Object.keys(regs).forEach(code=>{registrations[code]={};Object.keys(regs[code]).forEach(di=>{registrations[code][Number(di)]=regs[code][di];});});
  histRounds=[];
  (st.history||[]).forEach(h0=>{const h=Object.assign({},h0,{startDate:isoDateStr(h0.startDate)||h0.startDate});if(!isoDateStr(h.startDate))return;const days=[];for(let i=0;i<(h.rounds||0);i++)days.push({dateISO:ymd(addDays(h.startDate,i)),meals:{breakfast:[],lunch:[],dinner:[]}});
    Object.keys(h.menu||{}).forEach(di=>{const d=Number(di);
      if(!days[d]){if(isFinite(d)&&d>=0&&d<400)Object.keys(h.menu[di]).forEach(mk=>{_pushX(h.startDate,d,mk,h.menu[di][mk]);});return;}
      Object.keys(h.menu[di]).forEach(mk=>{days[d].meals[mk]=h.menu[di][mk]||[];});});
    const hr={};Object.keys(h.registrations||{}).forEach(c=>{hr[c]={};Object.keys(h.registrations[c]).forEach(di=>{hr[c][Number(di)]=h.registrations[c][di];});});
    histRounds.push({startDate:h.startDate,rounds:h.rounds,menuDays:days,registrations:hr});});
  checkins={};Object.keys(st.checkins||{}).forEach(d=>{const k=isoDateStr(d);if(k)checkins[k]=st.checkins[d];});
  serverFeedback=Array.isArray(st.feedback)?st.feedback:[];
  menuExtra=Object.keys(_xtra).sort().map(function(k){return _xtra[k];});
  saveStateCache(st);
}
function afterBoot(){if(IS_CHECKIN)doCheckin();else render();}
function boot(){
  moLoad();moFlush(); /* มีมื้อค้างส่งจากคราวก่อน → ส่งต่อทันที */
  if(apiEnabled()){
    /* 1) มีแคชในเครื่อง → วาดจอทันทีไม่ต้องรอเน็ต  2) ค่อยดึงข้อมูลจริงมาอัปเดตทับเงียบ ๆ */
    let shown=false;
    if(!IS_CHECKIN){const c=loadStateCache();if(c){try{applyStateFromAPI(c);shown=true;afterBoot();}catch(e){}}}
    apiGetState().then(st=>{applyStateFromAPI(st);stateFresh=true;
        if(!shown)afterBoot();
        else if(screen==='home'||screen==='todayMenu'){if(screen==='todayMenu'&&!mvFixed)mvDi=mvDefaultDi();render();}})
      .catch(err=>{console.warn('boot fetch failed',err);if(shown){toast('⚠️ ออฟไลน์อยู่ · แสดงข้อมูลล่าสุดที่บันทึกไว้');return;}toast('⚠️ เชื่อมต่อฐานข้อมูลไม่ได้ ใช้ข้อมูลตัวอย่างชั่วคราว');seedRegs();afterBoot();});
  } else {
    seedRegs();
    seedHistory();
    seedCheckins();
    menuPublished=true;
    afterBoot();
  }
}

function doSearch(){const qEl=document.getElementById('q');const q=((qEl&&qEl.value)||'').trim().toLowerCase();let list=employees.filter(e=>!q||e.code.includes(q)||e.name.toLowerCase().includes(q)||e.dept.toLowerCase().includes(q)).slice(0,8);

function userMenuReady(){return menuPublished&&menuHasFood();}
/* ===== แจ้งเตือนในแอป (in-app popup) — เด้งตอนเปิดแอป: "มีเมนูใหม่" / "ใกล้หมดเวลา" =====
   เด้งครั้งเดียวต่อรอบ (จำด้วย localStorage อิงคีย์รอบ) พอขึ้นรอบใหม่ก็เด้งใหม่เอง
   หมายเหตุ: นี่คือป๊อปอัปตอน "เปิดแอป" — ส่วนแจ้งเตือนเด้งหน้าจอตอนปิดแอป (เหมือน LINE) คือ Web Push เฟสถัดไป */
function hoursLeft(){return (regCutoff()-Date.now())/3600000;}
function notifSeen(k){try{return localStorage.getItem('notif_'+k+'_'+regRoundKey())==='1';}catch(e){return false;}}
function notifMark(k){try{localStorage.setItem('notif_'+k+'_'+regRoundKey(),'1');}catch(e){}}
function notifyModal(icon,accent,title,msg,primaryLabel,primaryFn){
  if(document.querySelector('.modal-ov'))return; /* มีป๊อปอัปอื่นค้างอยู่ ไม่ซ้อน */
  const o=document.createElement('div');o.className='modal-ov';
  o.innerHTML='<div class="modal-bx"><div class="mi">'+icon+'</div><div class="mt" style="color:'+accent+'">'+title+'</div><div class="mm">'+msg+'</div><div style="display:flex;gap:10px"><button class="btn btn-ghost" style="margin:0;flex:1">ไว้ก่อน</button><button class="btn btn-brand" style="margin:0;flex:1">'+primaryLabel+'</button></div></div>';
  const b=o.querySelectorAll('button');
  b[0].onclick=function(){o.remove();};
  b[1].onclick=function(){o.remove();if(primaryFn)primaryFn();};
  o.onclick=function(e){if(e.target===o)o.remove();};
  document.querySelector('.screen').appendChild(o);
}
function notifyCheck(){
  if(screen!=='home'||!stateFresh)return;           /* เด้งเฉพาะหน้าแรก และต่อเมื่อโหลดข้อมูลจริงแล้ว */
  if(!userMenuReady()||!regOpen())return;           /* ต้องมีเมนูเผยแพร่ + ยังเปิดรับอยู่ */
  var hl=hoursLeft();
  if(hl>0&&hl<=6&&!notifSeen('dl')){                 /* ใกล้หมดเวลา (≤6 ชม.) เด้งก่อน */
    notifMark('dl');
    notifyModal('⏰','var(--neg)','ใกล้หมดเวลาลงทะเบียน!','เหลืออีกประมาณ <b>'+Math.ceil(hl)+' ชม.</b> จะปิดรับลงทะเบียนรอบนี้<br>(ปิด '+regDlText()+')<br>รีบลงทะเบียนก่อนหมดเวลานะครับ','📝 ลงทะเบียนเลย',startUser);
    return;
  }
  if(!notifSeen('menu')){                            /* มีเมนูใหม่ เด้งครั้งแรกที่เห็นรอบนี้ */
    notifMark('menu');
    notifyModal('🍽️','var(--brand)','มีเมนูใหม่แล้ว!','เปิดให้ลงทะเบียนรับประทานอาหารรอบใหม่แล้ว<br>('+periodLabel()+')<br>ปิดรับ '+regDlText(),'📝 ลงทะเบียนเลย',startUser);
    return;
  }
}
/* ===== Web Push (OneSignal) — ปุ่ม "เปิดการแจ้งเตือน" เด้งหน้าจอเหมือน LINE =====
   พนักงานต้องกดอนุญาตครั้งเดียว จากนั้นเซิร์ฟเวอร์ส่ง push เด้งได้แม้ปิดแอป */
function nsPushSupported(){return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;}
function nsIsStandalone(){try{return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;}catch(e){return false;}}
function nsIOS(){try{return /iPhone|iPad|iPod/.test(navigator.userAgent);}catch(e){return false;}}
function nsGranted(){try{return 'Notification' in window && Notification.permission==='granted';}catch(e){return false;}}
function updateNotifBtn(){var el=document.getElementById('notifBtn');if(!el)return;
  if(!nsPushSupported()){el.style.display='none';return;}
  if(nsGranted()){el.innerHTML='🔔 การแจ้งเตือนเปิดอยู่ ✓';el.style.color='var(--pos)';el.style.opacity='.75';el.onclick=null;return;}
  el.innerHTML='🔔 เปิดการแจ้งเตือน (เด้งเตือนเมื่อมีเมนู / ใกล้หมดเวลา)';el.style.color='var(--brand)';el.style.opacity='1';el.onclick=nsSubscribe;}
function nsSubscribe(){
  if(!nsPushSupported()){showPopup('😕','อุปกรณ์นี้ไม่รองรับ','เบราว์เซอร์/อุปกรณ์นี้ยังไม่รองรับการแจ้งเตือนแบบเด้งหน้าจอ');return;}
  if(nsIOS()&&!nsIsStandalone()){showPopup('📲','iPhone ต้องติดตั้งแอปก่อน','บน iPhone: กดปุ่มแชร์ → "เพิ่มลงในหน้าจอโฮม" แล้วเปิดแอปจากไอคอน<br>จากนั้นจึงกดเปิดการแจ้งเตือนได้ (ข้อจำกัดของ iOS)');return;}
  window.OneSignalDeferred=window.OneSignalDeferred||[];
  window.OneSignalDeferred.push(async function(OneSignal){
    try{
      await OneSignal.Notifications.requestPermission();
      try{await OneSignal.User.PushSubscription.optIn();}catch(e){}
      if(nsGranted())toast('เปิดการแจ้งเตือนแล้ว ✓');
      else toast('ยังไม่ได้อนุญาต — กดอนุญาตเพื่อรับการแจ้งเตือน');
    }catch(e){console.warn('subscribe failed',e);}
    updateNotifBtn();
  });
}
/* ===== กันลงทะเบียนซ้ำ: บันทึกในเครื่อง + รอ server ยืนยันจริง ===== */
let stateFresh=false;            /* true = เพิ่งดึงข้อมูลจาก server สำเร็จ */
/* คีย์รวม "รุ่นข้อมูล" (regGen) — พอแอดมินล้างข้อมูล regGen เปลี่ยน คีย์เปลี่ยน บันทึกเก่าเลิกใช้เอง → ลงใหม่ได้ */
function regRoundKey(){return startDate+'|'+rounds+'|'+(regGen||0);}
function regDoneMap(){try{return JSON.parse(localStorage.getItem('canteen_reg_done')||'{}');}catch(e){return {};}}
function regDoneHas(code){return (regDoneMap()[regRoundKey()]||[]).includes(code);}
function regDoneMark(code){try{const m=regDoneMap();const k=regRoundKey();m[k]=m[k]||[];if(!m[k].includes(code))m[k].push(code);localStorage.setItem('canteen_reg_done',JSON.stringify(m));}catch(e){}}
function regDoneClearRound(){try{const m=regDoneMap();delete m[regRoundKey()];localStorage.setItem('canteen_reg_done',JSON.stringify(m));}catch(e){}}
/* บล็อกซ้ำ: เชื่อ "บันทึกในเครื่อง" เสมอ (บันทึกเฉพาะเมื่อ server ยืนยันแล้ว) — กันเหนียวแม้ server ตอบช้า */
function regBlocked(code){return regComplete(code)||regDoneHas(code);}
function startUser(){
  /* เข้าหน้าลงทะเบียนทันทีไม่ต้องรอ API — boot() โหลดข้อมูลไว้แล้ว */
  startUserGo();
  /* รีเฟรชข้อมูลเบื้องหลัง ไม่บล็อก UI */
  if(apiEnabled())apiGetState().then(function(st){try{applyStateFromAPI(st);stateFresh=true;}catch(e){}}).catch(function(){});
}
function startUserGo(){if(!regOpen()){go('regClosed');return;}if(!userMenuReady()){noMenuPopup();return;}codeInput='';go('userCode');}
function renderRegClosed(){body().innerHTML=`<div style="text-align:center;padding-top:10px"><div style="font-size:62px;margin-bottom:10px">⏰</div><h2 style="font-size:21px;margin:0 0 10px;color:var(--brand)">หมดเวลาลงทะเบียนรอบนี้แล้วจ้า</h2><p style="color:var(--muted);font-size:15.5px;line-height:1.85;margin:0 0 20px">รอติดตามเมนูอาหารรอบหน้า 🍚<br><span style="font-size:13px">ระบบเปิดให้ลงทะเบียนถึง<br>${regDlText()} (เวลาประเทศไทย)</span></p></div><button class="btn btn-brand" onclick="go('home')">กลับหน้าแรก</button>`;}
function renderUserCode(){body().innerHTML=`<div class="card" style="text-align:center;padding-top:18px"><div style="width:62px;height:62px;border-radius:17px;background:var(--brand-soft);display:grid;place-items:center;font-size:30px;margin:0 auto 6px">👤</div><div style="font-weight:700;font-size:18px">ใส่รหัสพนักงานของคุณ</div><div class="code-display" id="codeDisp">${codeInput||'—'}</div></div>
  <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="keyCode('${n}')">${n}</button>`).join('')}<button class="act" onclick="keyCode('del')">⌫</button><button onclick="keyCode('0')">0</button><button class="act" onclick="keyCode('ok')">✓</button></div>
  <button class="btn btn-ghost" style="margin-top:12px" onclick="go('empSearch')">🔍 จำรหัสไม่ได้? ค้นหาชื่อ</button>`;}
function keyCode(k){if(k==='del')codeInput=codeInput.slice(0,-1);else if(k==='ok'){const e=employees.find(x=>x.code===codeInput);if(!e){toast('ไม่พบรหัสนี้ ลองค้นหาชื่อ');return;}if(!userMenuReady()){noMenuPopup();return;}if(regBlocked(e.code)){alreadyRegPopup();return;}currentUser=e;registrations[e.code]=registrations[e.code]||{};regDayIdx=firstIncompleteDay(e.code);go('userReg');return;}else if(codeInput.length<6)codeInput+=k;const d=document.getElementById('codeDisp');if(d)d.textContent=codeInput||'—';}

/* ---- combined day registration: per-meal buttons under each menu + shortcuts ---- */
function renderUserReg(){const di=regDayIdx,day=menuDays[di],d=thDateISO(day.dateISO),am=availMealsFor(currentUser,di);const rec=(registrations[currentUser.code]||{})[di]||{};
  body().innerHTML=`<div class="hero"><div class="n">${currentUser.name}</div><div class="meta">รหัส ${currentUser.code} · ${currentUser.dept}</div>${currentUser.daily?'<div style="margin-top:7px"><span style="background:rgba(255,255,255,.2);padding:4px 11px;border-radius:9px;font-size:12.5px;font-weight:700">👷 พนักงานรายวัน · ลงได้เฉพาะคาบเที่ยง</span></div>':''}</div>
  <div class="progress">${menuDays.map((_,i)=>`<span class="${i<di?'on':i===di?'cur':''}"></span>`).join('')}</div>
  <div class="datehdr"><div class="sub">วันที่ ${di+1} จาก ${menuDays.length} · เลือกการทานแต่ละคาบ</div><div class="big">${d.dow} ${d.short}</div></div>
  ${am.map(m=>{const items=day.meals[m[0]];const sel=rec[m[0]];
    const thumbs=items.map((x,ix)=>x.img?`<div class="thumb-wrap" onclick="openImgItem(${di},'${m[0]}',${ix})"><img class="thumb" src="${x.img}"><span class="zoom">🔍</span></div>`:'').join('');
    return `<div class="card meal-card"><div class="meal-head"><div class="meal-ic">${m[2]}</div><div style="flex:1"><div class="mn">${m[1]}</div><div class="items">${items.map(x=>x.name).join(' / ')}</div></div>${thumbs}</div>
      <div class="choice"><button class="ch ch-yes ${sel===true?'sel':''}" onclick="setMeal(${di},'${m[0]}',true)">✓ ทาน</button><button class="ch ch-no ${sel===false?'sel':''}" onclick="setMeal(${di},'${m[0]}',false)">✕ ไม่ทาน</button></div></div>`;}).join('')}
  <div style="height:6px"></div>
  <button class="btn btn-brand" onclick="confirmDay()">${di===menuDays.length-1?'ยืนยัน · เสร็จสิ้น':'ยืนยัน'}</button>
  <button class="btn btn-ghost" onclick="${prevRegDay(di)<0?'cancelReg()':'prevDay()'}">${prevRegDay(di)<0?'ยกเลิก':'‹ กลับไปแก้ไข'}</button>`;}
function setMeal(di,mk,eat){registrations[currentUser.code]=registrations[currentUser.code]||{};registrations[currentUser.code][di]=registrations[currentUser.code][di]||{};registrations[currentUser.code][di][mk]=eat;render();}
/* เลือกครบแต่ละวันแล้วไปวันถัดไป — ยังไม่ส่ง server (ส่งทีเดียวทั้งรอบตอนจบ = atomic กันข้อมูลลงไม่ครบ) */
function confirmDay(){const di=regDayIdx,am=availMealsFor(currentUser,di),rec=(registrations[currentUser.code]||{})[di]||{};if(!am.every(m=>m[0] in rec)){toast('กรุณาเลือกให้ครบทุกคาบ');return;}
  nextDay();}
/* ข้ามวันที่ไม่มีเมนู/วันหยุด อัตโนมัติในขั้นตอนลงทะเบียน */
function regDayHasMeals(di){return availMealsFor(currentUser,di).length>0;}
function prevRegDay(di){let i=di-1;while(i>=0&&!regDayHasMeals(i))i--;return i;}
function prevDay(){const i=prevRegDay(regDayIdx);if(i>=0){regDayIdx=i;go('userReg');}}
function cancelReg(){currentUser=null;go('home');}
function nextDay(){let i=regDayIdx+1;while(i<menuDays.length&&!regDayHasMeals(i))i++;if(i>=menuDays.length)go('userDone');else{regDayIdx=i;go('userReg');}}
function openImgItem(di,mk,ix){const it=menuDays[di].meals[mk][ix];if(it&&it.img)openLightbox(it.img);}
function openLightbox(src){const o=document.createElement('div');o.className='lightbox';o.innerHTML=`<img src="${src}"><div class="lb-close">✕ แตะเพื่อปิด</div>`;o.onclick=()=>o.remove();document.querySelector('.screen').appendChild(o);}

/* ===== ตรวจสอบที่ฉันลงไว้: ใส่รหัส → ดูสถานะทาน/ไม่ทาน/ยังไม่ลง ต่อวัน/คาบ (ข้อมูลล่าสุดจากเซิร์ฟเวอร์) ===== */
let myRegCode='',myRegUser=null;
function renderMyRegCode(){body().innerHTML=`<div class="card" style="text-align:center;padding-top:18px"><div style="width:62px;height:62px;border-radius:17px;background:var(--brand-soft);display:grid;place-items:center;font-size:30px;margin:0 auto 6px">🔍</div><div style="font-weight:700;font-size:18px">ตรวจสอบสิทธิ์ · ใส่รหัสพนักงาน</div><div class="code-display" id="codeDisp">${myRegCode||'—'}</div></div>
  <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="keyMyReg('${n}')">${n}</button>`).join('')}<button class="act" onclick="keyMyReg('del')">⌫</button><button onclick="keyMyReg('0')">0</button><button class="act" onclick="keyMyReg('ok')">✓</button></div>
  <button class="btn btn-ghost" style="margin-top:12px" onclick="go('home')">กลับหน้าแรก</button>`;}
function keyMyReg(k){if(k==='del')myRegCode=myRegCode.slice(0,-1);
  else if(k==='ok'){const e=employees.find(x=>x.code===myRegCode);if(!e){toast('ไม่พบรหัสนี้');return;}myRegUser=e;go('myRegView');
    if(apiEnabled())apiGetState().then(function(st){try{applyStateFromAPI(st);}catch(e2){}if(screen==='myRegView')render();}).catch(function(){});return;}
  else if(myRegCode.length<6)myRegCode+=k;const d=document.getElementById('codeDisp');if(d)d.textContent=myRegCode||'—';}
function renderMyRegView(){const e=myRegUser;if(!e){go('myRegCode');return;}const recs=registrations[e.code]||{};let any=false;
  const html=menuDays.map((day,di)=>{const d=thDateISO(day.dateISO);if(isHoliday(di))return `<div class="card"><div class="sec-title">${d.dow} ${d.short}</div><div class="note" style="text-align:left;padding:4px">🏖️ วันหยุด</div></div>`;const am=availMealsFor(e,di);if(!am.length)return '';const r=recs[di]||{};
    const rows=am.map(m=>{const has=(m[0] in r);if(has)any=true;const cls=has?(r[m[0]]?'up':'no'):'wait';const tx=has?(r[m[0]]?'ทาน':'ไม่ทาน'):'ยังไม่ลง';const mn=(day.meals[m[0]]||[]).map(x=>x.name).filter(Boolean).join(', ');return `<div class="row-item"><span style="font-size:19px">${m[2]}</span><span style="flex:1"><span style="font-weight:600">${m[1]}</span>${mn?`<br><span style="font-size:12px;color:var(--muted);line-height:1.35">${escHtml(mn)}</span>`:''}</span><span class="pill ${cls}">${tx}</span></div>`;}).join('');
    return `<div class="card"><div class="sec-title">${d.dow} ${d.short}</div>${rows}</div>`;}).join('');
  const complete=regComplete(e.code);
  body().innerHTML=`<div class="hero"><div class="n">${e.name}</div><div class="meta">รหัส ${e.code} · ${e.unit||e.dept}</div></div>
  <div class="hint" style="${complete?'':'background:var(--amber-l);color:#92400e'}">${complete?'✅ ลงทะเบียนครบทุกวันแล้ว':(any?'⚠️ ลงทะเบียนยังไม่ครบ':'⏳ ยังไม่ได้ลงทะเบียนรอบนี้')} · ${periodLabel()}</div>${html}
  ${(!complete&&regOpen()&&userMenuReady())?`<button class="btn btn-brand" onclick="codeInput='${e.code}';keyCode('ok')">📝 ไปลงทะเบียน${any?'ต่อ':''}</button>`:''}
  <button class="btn btn-ghost" onclick="go('home')">กลับหน้าแรก</button>`;}
function renderUserDone(){const recs=registrations[currentUser.code]||{};
  let html=menuDays.map((day,di)=>{const d=thDateISO(day.dateISO),r=recs[di]||{};if(isHoliday(di))return `<div class="card"><div class="sec-title">${d.dow} ${d.short}</div><div class="note" style="text-align:left;padding:4px">🏖️ วันหยุด</div></div>`;if(!availMealsFor(currentUser,di).length)return '';const rows=availMealsFor(currentUser,di).map(m=>`<div class="row-item"><span style="font-size:19px">${m[2]}</span><span style="flex:1;font-weight:600">${m[1]}</span><span class="pill ${r[m[0]]?'up':'no'}">${r[m[0]]?'ทาน':'ไม่ทาน'}</span></div>`).join('');return `<div class="card"><div class="sec-title">${d.dow} ${d.short}</div>${rows}</div>`;}).join('');
  body().innerHTML=`<div style="text-align:center"><div class="done-check">✓</div><h2 style="font-size:22px;margin:0">ลงทะเบียนสำเร็จ</h2><p style="color:var(--muted);margin:5px 0 14px">${currentUser.name} · ${currentUser.code}</p><div id="saveStat" style="font-size:13.5px;margin:-4px 0 12px"></div></div>${html}<button class="btn btn-brand" onclick="go('home')">เสร็จสิ้น · กลับหน้าแรก</button>`;submitRegistration(currentUser.code);}
/* ส่งข้อมูลทั้งรอบ "ครั้งเดียว" (atomic) — server เก็บครบทุกวันหรือไม่เก็บเลย ไม่มีทางลงไม่ครบ */
function submitRegistration(code){const el=()=>document.getElementById('saveStat');
  if(!apiEnabled()){regDoneMark(code);return;}
  if(el())el().innerHTML='<span style="color:var(--muted)">⏳ กำลังบันทึกลงฐานข้อมูล...</span>';
  const days={};menuDays.forEach((_,di)=>{const r=(registrations[code]||{})[di];if(r&&Object.keys(r).length)days[di]=r;});
  apiPost('saveRegistration',{code:code,days:days}).then(res=>{
    if(res&&res.ok){regDoneMark(code);if(el())el().innerHTML='<span style="color:var(--pos);font-weight:700">✓ บันทึกลงฐานข้อมูลแล้ว</span>';}
    else if(el())el().innerHTML=`<span style="color:var(--neg);font-weight:700">⚠️ ส่งข้อมูลไม่สำเร็จ (เน็ตขัดข้อง)</span><br><button class="btn btn-brand" style="margin:8px 0 0;padding:11px" onclick="submitRegistration('${code}')">📡 ลองส่งอีกครั้ง</button>`;
  },()=>{if(el())el().innerHTML=`<span style="color:var(--neg);font-weight:700">⚠️ ส่งข้อมูลไม่สำเร็จ (เน็ตขัดข้อง)</span><br><button class="btn btn-brand" style="margin:8px 0 0;padding:11px" onclick="submitRegistration('${code}')">📡 ลองส่งอีกครั้ง</button>`;});}

function keyPin(k){if(k==='del')pinInput=pinInput.slice(0,-1);else if(k==='ok'){if(pinInput===getPIN())return go('adminHub');toast('PIN ไม่ถูกต้อง');pinInput='';}else if(pinInput.length<4){pinInput+=k;if(pinInput.length===4)return setTimeout(()=>{if(pinInput===getPIN())go('adminHub');else{toast('PIN ไม่ถูกต้อง');pinInput='';render();}},140);}const dots=document.getElementById('pinDots');if(dots)dots.innerHTML=[0,1,2,3].map(i=>`<span class="${i<pinInput.length?'on':''}"></span>`).join('');}

function renderAdminPinSet(){const buf=npStage==='new'?npNew:npConfirm;body().innerHTML=`<div class="card" style="text-align:center;padding-top:18px"><div style="width:60px;height:60px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font-size:28px;margin:0 auto 6px">🔑</div><div style="font-weight:700;font-size:18px">${npStage==='new'?'ตั้งรหัส PIN ใหม่':'ยืนยันรหัสอีกครั้ง'}</div><div class="pin-dots">${[0,1,2,3].map(i=>`<span class="${i<buf.length?'on':''}"></span>`).join('')}</div><div style="color:var(--muted);font-size:12.5px">${npStage==='new'?'ใส่ตัวเลข 4 หลัก':'ใส่ให้ตรงกับรหัสใหม่'}</div></div>
  <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="keyNewPin('${n}')">${n}</button>`).join('')}<button class="act" onclick="keyNewPin('del')">⌫</button><button onclick="keyNewPin('0')">0</button><button class="act" onclick="keyNewPin('del')">⌫</button></div>
  <div class="note">รหัสจะถูกเก็บไว้ในเครื่องนี้ (ใช้กับหน้าเข้าสู่ระบบผู้ดูแล)</div>`;}
function keyNewPin(k){let buf=npStage==='new'?npNew:npConfirm;if(k==='del')buf=buf.slice(0,-1);else if(buf.length<4)buf+=k;if(npStage==='new')npNew=buf;else npConfirm=buf;
  if(buf.length===4&&k!=='del'){if(npStage==='new'){setTimeout(()=>{npStage='confirm';render();},130);return;}else{if(npConfirm===npNew){setPINstore(npNew);toast('บันทึก PIN ใหม่แล้ว ✓');setTimeout(()=>{npNew='';npConfirm='';npStage='new';go('adminHub');},650);}else{toast('รหัสไม่ตรงกัน ลองใหม่');npNew='';npConfirm='';npStage='new';setTimeout(render,300);}return;}}render();}

/* ===== เปิด/ขยายเวลาลงทะเบียนพิเศษ: แอดมินเลือกวัน–เวลาปิดเอง (มีผลทุกเครื่อง + ตัวแจ้งเตือน) ===== */
function renderAdminDeadline(){
  var cur=regCutoff();var d=new Date(cur+7*3600*1000);var p=function(n){return String(n).padStart(2,'0');};
  var dv=d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate());
  var tv=p(d.getUTCHours())+':'+p(d.getUTCMinutes());
  var custom=!!regDeadlineISO;
  body().innerHTML=`<div class="hint">ตั้งวัน–เวลาปิดรับลงทะเบียนเอง (กรณีพิเศษ) · มีผลกับพนักงานทุกเครื่องทันที</div>
  <div class="card">
    <div class="note" style="text-align:left;padding:4px 2px 12px;line-height:1.9">ตอนนี้ปิดรับ: <b>${regDlText()}</b><br>${custom?'<span style="color:var(--amber);font-weight:700">● ตั้งเอง (พิเศษ)</span>':'<span style="color:var(--muted)">● ค่าระบบ (17:00 วันก่อนเริ่มรอบ)</span>'} · ${regOpen()?'<span style="color:var(--pos);font-weight:700">เปิดรับอยู่</span>':'<span style="color:var(--neg);font-weight:700">ปิดรับแล้ว</span>'}</div>
    <label class="fld">วันที่ปิดรับ</label><input class="txt" type="date" id="dlDate" value="${dv}">
    <label class="fld">เวลาปิดรับ</label><input class="txt" type="time" id="dlTime" value="${tv}">
  </div>
  <button class="btn btn-brand" onclick="saveSpecialDeadline()">✓ บันทึก (เปิดให้ลงทะเบียนถึงเวลานี้)</button>
  ${custom?`<button class="btn btn-ghost" onclick="resetSpecialDeadline()">↩︎ กลับไปใช้ค่าระบบ</button>`:''}
  <button class="btn btn-ghost" onclick="go('adminHub')">กลับเมนูผู้ดูแล</button>
  <div class="note" style="text-align:left;line-height:1.85">• ตั้งเวลาช้ากว่าตอนนี้ = เปิด/ขยายให้ลงทะเบียนต่อ<br>• ตัวแจ้งเตือน "ใกล้ปิดรับ" จะอิงเวลานี้<br>• ใช้เฉพาะรอบปัจจุบัน · ขึ้นรอบใหม่กลับเป็นค่าระบบเอง</div>`;
}
function saveSpecialDeadline(){
  var dt=document.getElementById('dlDate').value,tm=document.getElementById('dlTime').value;
  if(!dt||!tm){toast('กรุณาเลือกวันและเวลา');return;}
  var iso=dt+'T'+tm+':00+07:00';if(isNaN(Date.parse(iso))){toast('วัน-เวลาไม่ถูกต้อง');return;}
  regDeadlineISO=iso;
  apiPost('saveConfig',{regDeadline:iso}).then(function(res){if(!res||res.ok===false)showPopup('⚠️','บันทึกไม่สำเร็จ','เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่อีกครั้ง');});
  toast('ตั้งเวลาปิดรับพิเศษแล้ว ✓');go('adminHub');
}
function resetSpecialDeadline(){
  regDeadlineISO='';
  apiPost('saveConfig',{regDeadline:''}).then(function(){});
  toast('กลับไปใช้ค่าระบบแล้ว ✓');go('adminHub');
}

function drawEmpDelList(){const q=empDelQ.trim().toLowerCase();const list=employees.filter(e=>!q||e.code.includes(q)||e.name.toLowerCase().includes(q)||(e.unit||'').toLowerCase().includes(q)).slice(0,8);
  const el=document.getElementById('empDelList');if(!el)return;
  el.innerHTML=list.length?list.map(e=>`<div class="emp-item"><div style="flex:1"><div class="nm">${e.name}</div><div class="dp">${e.unit||e.dept}${e.daily?' · 👷 รายวัน':' · ระดับ 4+'}</div></div><span class="code-badge">${e.code}</span><button onclick="delEmpAsk('${e.code}')" style="margin-left:8px;background:var(--neg-l);color:var(--neg);border:none;border-radius:10px;padding:8px 13px;font-weight:800;font-size:13px;font-family:inherit;cursor:pointer">ลบ</button></div>`).join(''):`<div class="note" style="padding:22px">ไม่พบพนักงาน</div>`;
  const nt=document.getElementById('empDelNote');if(nt)nt.textContent=`พนักงานทั้งหมด ${employees.length} คน (ประจำ ${REG_EMPS.length} · รายวัน ${DAILY_EMPS.length})`;}

function downloadQRPoster(){const url=ciUrl();const W=800,H=930,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#062F6E';x.fillRect(0,0,W,130);
  x.textBaseline='middle';x.textAlign='center';x.fillStyle='#fff';x.font="800 34px 'IBM Plex Sans Thai','Sarabun',sans-serif";x.fillText('สแกนยืนยัน "มาทานจริง" 🍚',W/2,52);

  const qr=qrcode(0,'M');qr.addData(url);qr.make();const n=qr.getModuleCount();const size=520,cell=size/n,ox=(W-size)/2,oy=170;
  x.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))x.fillRect(ox+c*cell,oy+r*cell,cell+0.5,cell+0.5);
  let yy=oy+size+58;x.fillStyle='#0f172a';x.font="800 27px 'IBM Plex Sans Thai',sans-serif";x.fillText('สแกนก่อนรับอาหารทุกครั้ง',W/2,yy);
  x.fillStyle='#94a3b8';x.font="500 16px 'IBM Plex Sans Thai',sans-serif";x.fillText('1 เครื่อง สแกนได้ 1 ครั้งต่อคาบ · จากแอปลงทะเบียนอาหารโรงครัว',W/2,H-36);
  shareCanvas(cv);}

function aggMeal(){const c={breakfast:0,lunch:0,dinner:0};Object.values(registrations).forEach(days=>Object.values(days).forEach(r=>MEALS.forEach(m=>{if(r[m[0]])c[m[0]]++;})));return c;}

function aggDept(){const c={};DEPTS.forEach(d=>c[d]=0);employees.forEach(e=>{const days=registrations[e.code]||{};Object.values(days).forEach(r=>MEALS.forEach(m=>{if(r[m[0]])c[e.dept]++;}));});return Object.entries(c).map(([k,v])=>({label:k,val:v})).sort((a,b)=>b.val-a.val);}
function aggMenu(){const arr=[];menuDays.forEach((day,di)=>{const d=thDateISO(day.dateISO);MEALS.forEach(m=>{const items=day.meals[m[0]]||[];if(!items.length)return;let n=0;Object.values(registrations).forEach(days=>{const r=days[di];if(r&&r[m[0]])n++;});arr.push({label:items.map(x=>x.name).join(' / '),sub:`${d.dow.slice(0,2)} · ${m[1]}`,emoji:items[0].emoji,img:items[0].img,val:n});});});return arr.sort((a,b)=>b.val-a.val);}
function aggPerson(){return employees.map(e=>{const days=registrations[e.code]||{};let reg=0;Object.values(days).forEach(r=>MEALS.forEach(m=>{if(m[0] in r)reg++;}));return{e,reg};}).sort((a,b)=>b.reg-a.reg);}
function aggPersonByMode(mode){return employees.map(e=>{const days=registrations[e.code]||{};let cnt=0;if(mode==='eat'){Object.values(days).forEach(r=>MEALS.forEach(m=>{if(r[m[0]])cnt++;}));}else if(mode==='no'){Object.values(days).forEach(r=>MEALS.forEach(m=>{if(m[0] in r&&!r[m[0]])cnt++;}));}else{Object.values(days).forEach(r=>MEALS.forEach(m=>{if(m[0] in r)cnt++;}));}return{e,reg:cnt};}).sort((a,b)=>b.reg-a.reg);}

let dashUpdated='',dashTimer=null;
function nowClock(){const n=new Date(Date.now()+(7*60+new Date().getTimezoneOffset())*60000);const p=x=>String(x).padStart(2,'0');return p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());}
function regSig(){let n=0;Object.keys(registrations).forEach(c=>{n+=Object.keys(registrations[c]||{}).length;});return n+'|'+JSON.stringify(checkins).length;}
function refreshDash(manual){
