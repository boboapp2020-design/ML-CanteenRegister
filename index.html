<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>แอปลงทะเบียนรับประทานอาหารที่โรงครัว · มิตรลาว</title>
<meta name="theme-color" content="#062F6E">
<meta name="color-scheme" content="only light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ลงทะเบียนอาหารโรงครัว">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: only light;
    --brand:#062F6E; --brand2:#0A63B0; --brand-l:#cfe9fb; --brand-soft:#eff8ff; --sky:#00AEEF;
    --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff;
    --pos:#16a34a; --pos-l:#dcfce7; --neg:#dc2626; --neg-l:#fee2e2;
    --info:#0ea5e9; --info-l:#e0f2fe; --amber:#d97706; --amber-l:#fef3c7; --slate:#475569;
    --sh-sm:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.05);
    --sh:0 4px 16px rgba(15,23,42,.08); --sh-lg:0 18px 40px rgba(15,23,42,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{margin:0;height:100%;}
  body{font-family:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif;background:#dfe6ee;color:var(--ink);}
  .shell{max-width:520px;margin:0 auto;padding:18px 16px 40px;}
  .demo-head{text-align:center;margin-bottom:12px;}
  .demo-head h1{font-size:18px;margin:0;font-weight:700;color:var(--brand);}
  .demo-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px;}
  .stage{display:flex;justify-content:center;}
  .phone{width:392px;max-width:100%;background:#0b1220;border-radius:44px;padding:11px;box-shadow:var(--sh-lg);}
  .screen{background:var(--bg);border-radius:34px;overflow:hidden;height:788px;position:relative;display:flex;flex-direction:column;}
  .hdr{flex-shrink:0;min-height:58px;display:flex;align-items:center;gap:11px;padding:12px 15px;background:var(--card);border-bottom:1px solid var(--line);z-index:5;}
  .hdr.hdr-bottom{order:3;border-bottom:none;border-top:1px solid var(--line);}
  .hdr .nav{background:var(--bg);border:1px solid var(--line);border-radius:11px;width:38px;height:38px;font-size:19px;cursor:pointer;color:var(--ink2);display:grid;place-items:center;flex-shrink:0;}
  .hdr .title{font-weight:700;font-size:17px;}
  .hdr .bm{width:42px;height:42px;border-radius:11px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex-shrink:0;} .hdr .bm img{width:100%;height:100%;object-fit:contain;padding:3px;}
  .hdr .bt{font-weight:700;font-size:15.5px;line-height:1.15;} .hdr .bs{color:var(--muted);font-size:11.5px;}
  .app-body{flex:1;overflow-y:auto;padding:18px 16px 22px;-webkit-overflow-scrolling:touch;}
  .app-body.center{display:flex;flex-direction:column;justify-content:center;}
  .app-body::-webkit-scrollbar{width:0;}
  @media(max-width:640px){
    body{background:var(--bg);} .shell{padding:0;max-width:100%;} .demo-head,.caption{display:none;}
    .phone{padding:0;border-radius:0;width:100%;box-shadow:none;} .screen{border-radius:0;height:100vh;height:100dvh;}
  }
  /* ติดตั้งเป็นแอป (มือถือ/แท็บเล็ตทุกขนาดจอ) = เต็มจอเสมอ */
  @media(display-mode:standalone),(display-mode:fullscreen){
    body{background:var(--bg);} .shell{padding:0;max-width:100%;} .demo-head,.caption{display:none;}
    .phone{padding:0;border-radius:0;width:100%;box-shadow:none;} .screen{border-radius:0;height:100vh;height:100dvh;max-width:640px;margin:0 auto;}
  }

  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--sh-sm);margin-bottom:12px;}
  .btn{width:100%;border:none;border-radius:13px;padding:17px;font-family:inherit;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:.12s;}
  .btn:active{transform:scale(.985);}
  .btn-brand{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(6,47,110,.28);}
  .btn-pos{background:var(--pos);color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.26);}
  .btn-neg{background:#fff;color:var(--neg);border:2px solid var(--neg);}
  .btn-ghost{background:#fff;color:var(--ink2);border:1px solid var(--line);font-size:16px;padding:14px;box-shadow:var(--sh-sm);}
  .btn+.btn{margin-top:10px;}

  .hub-btn{width:100%;border:1px solid var(--line);border-radius:17px;padding:19px 17px;font-family:inherit;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:14px;font-size:18px;margin-bottom:12px;transition:.12s;text-align:left;background:var(--card);color:var(--ink);box-shadow:var(--sh-sm);}
  .hub-btn:active{transform:scale(.985);}
  .hub-btn .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:25px;flex-shrink:0;}
  .hub-btn small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:3px;}
  .hub-primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 8px 20px rgba(6,47,110,.28);}
  .hub-primary small{color:rgba(255,255,255,.82);} .hub-primary .ic{background:rgba(255,255,255,.16);}
  .ic-blue{background:var(--info-l);color:var(--info);} .ic-slate{background:#f1f5f9;color:var(--slate);} .ic-amber{background:var(--amber-l);color:var(--amber);} .ic-red{background:var(--neg-l);color:var(--neg);}
  .hub-danger{border-color:var(--neg-l);} .hub-danger small{color:var(--neg);opacity:.85;}

  .search-wrap{position:relative;margin-bottom:12px;}
  .search-wrap input{width:100%;padding:15px 15px 15px 46px;font-size:17px;font-family:inherit;border:1px solid var(--line);border-radius:13px;outline:none;font-weight:500;background:#fff;box-shadow:var(--sh-sm);}
  .search-wrap input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--brand-l);}
  .search-wrap .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.6;}
  .emp-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent;}
  .emp-item:hover{background:var(--brand-soft);border-color:var(--brand-l);}
  .avatar{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:17px;flex-shrink:0;border:1px solid var(--brand-l);}
  .emp-item .nm{font-weight:600;font-size:16px;} .emp-item .dp{color:var(--muted);font-size:13px;}
  .code-badge{background:var(--ink);color:#fff;font-weight:700;padding:5px 10px;border-radius:9px;font-size:14px;}

  .pin-dots{display:flex;justify-content:center;gap:15px;margin:12px 0 6px;}
  .pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);}
  .pin-dots span.on{background:var(--brand);border-color:var(--brand);}
  .code-display{text-align:center;font-size:36px;font-weight:700;letter-spacing:8px;min-height:48px;margin:8px 0 10px;}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .keypad button{padding:17px;font-size:24px;font-weight:700;font-family:inherit;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;box-shadow:var(--sh-sm);color:var(--ink);}
  .keypad button:active{background:var(--brand-soft);}
  .keypad button.act{background:var(--brand);color:#fff;font-size:16px;border-color:var(--brand);}

  .hero{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);}
  .hero .n{font-size:20px;font-weight:700;} .hero .meta{font-size:13px;opacity:.85;margin-top:3px;}
  .progress{display:flex;gap:5px;margin-bottom:12px;}
  .progress span{flex:1;height:6px;border-radius:4px;background:var(--line);}
  .progress span.on{background:var(--brand);} .progress span.cur{background:var(--amber);}
  .datehdr{text-align:center;margin-bottom:12px;}
  .datehdr .big{font-size:23px;font-weight:700;} .datehdr .sub{color:var(--muted);font-size:14px;}

  .meal-card{padding:14px;}
  .meal-head{display:flex;align-items:center;gap:11px;}
  .meal-ic{width:40px;height:40px;border-radius:11px;background:var(--bg);display:grid;place-items:center;font-size:21px;flex-shrink:0;}
  .meal-head .mn{font-weight:600;font-size:12.5px;color:var(--muted);letter-spacing:.2px;} .meal-head .items{color:var(--ink);font-size:19px;font-weight:800;margin-top:1px;line-height:1.35;}
  .thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;cursor:pointer;border:1px solid var(--line);flex-shrink:0;position:relative;}
  .thumb-wrap{position:relative;flex-shrink:0;}
  .thumb-wrap .zoom{position:absolute;right:2px;bottom:2px;background:rgba(15,23,42,.72);color:#fff;font-size:9px;padding:1px 4px;border-radius:5px;pointer-events:none;}
  .choice{display:flex;gap:10px;margin-top:12px;}
  .ch{flex:1;border:2px solid var(--line);background:#fff;border-radius:11px;padding:11px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;transition:.1s;}
  .ch-yes{background:#fff;color:#15803d;border-color:var(--pos);} .ch-no{background:#fff;color:var(--neg);border-color:var(--neg);}
  .ch:active{transform:scale(.97);}
  .ch-yes.sel{background:var(--pos);color:#fff;border-color:var(--pos);box-shadow:0 4px 12px rgba(22,163,74,.3);} .ch-no.sel{background:var(--neg);color:#fff;border-color:var(--neg);box-shadow:0 4px 12px rgba(220,38,38,.28);}
  .divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;font-weight:600;margin:14px 2px 12px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}

  .menu-photo{width:100%;height:130px;border-radius:12px;display:grid;place-items:center;font-size:56px;margin-bottom:12px;background:var(--brand-soft);overflow:hidden;border:1px solid var(--brand-l);}
  .menu-photo img{width:100%;height:100%;object-fit:cover;}
  .done-check{width:92px;height:92px;border-radius:50%;background:var(--pos-l);color:var(--pos);display:grid;place-items:center;font-size:50px;margin:12px auto;}
  .toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:var(--sh-lg);}
  .toast.show{opacity:1;bottom:34px;}
  .modal-ov{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(2,6,23,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:26px;}
  .modal-bx{background:#fff;border-radius:20px;padding:24px 20px 18px;max-width:330px;width:100%;text-align:center;box-shadow:var(--sh-lg);animation:popIn .18s ease;}
  @keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-bx .mi{font-size:46px;margin-bottom:8px;}
  .modal-bx .mt{font-weight:800;font-size:17.5px;color:var(--ink);margin-bottom:6px;}
  .modal-bx .mm{color:var(--muted);font-size:14px;line-height:1.75;margin-bottom:16px;}
  .modal-bx .pin-inp{width:150px;margin:0 auto 14px;display:block;text-align:center;font-size:24px;letter-spacing:10px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:10px 4px;outline:none;}
  .modal-bx .pin-inp:focus{border-color:var(--brand2);}
  .lightbox{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(2,6,23,.9);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;cursor:zoom-out;}
  .lightbox img{max-width:100%;max-height:78%;border-radius:14px;box-shadow:var(--sh-lg);}
  .lightbox .lb-close{color:#fff;font-weight:600;font-size:14px;background:rgba(255,255,255,.14);padding:9px 16px;border-radius:10px;}

  .kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--sh-sm);}
  .kpi .v{font-size:25px;font-weight:800;line-height:1;} .kpi .l{color:var(--muted);font-size:12px;font-weight:500;margin-top:5px;} .kpi .sub{font-size:11px;font-weight:600;margin-top:4px;}
  .kpi.g .v{color:var(--brand);} .kpi.b .v{color:var(--info);} .kpi.a .v{color:var(--amber);} .kpi.n .v{color:var(--ink);}
  .sec-title{font-size:15px;font-weight:700;margin:2px 2px 10px;display:flex;align-items:center;gap:7px;}
  .sec-title .cap{color:var(--muted);font-weight:500;font-size:12px;margin-left:auto;}
  .share-ic{width:36px;height:36px;flex-shrink:0;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:16px;cursor:pointer;font-family:inherit;box-shadow:var(--sh-sm);margin-left:8px;}
  .save-ic{background:var(--pos);}
  .period{display:inline-flex;align-items:center;gap:6px;background:var(--info-l);color:#075985;font-weight:600;font-size:12px;padding:6px 11px;border-radius:8px;margin-bottom:12px;}
  .dash-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .rfr-btn{margin-left:auto;border:1px solid var(--info);background:var(--info-l);color:#075985;font-family:inherit;font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;}
  .rfr-btn:active{transform:scale(.96);}
  .dash-upd{font-size:11px;color:var(--muted);margin-bottom:12px;padding-left:2px;}
  .row-item{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line);}
  .row-item:last-child{border-bottom:none;}
  .stack-click{transition:background .12s;border-radius:8px;padding:10px 6px;margin:0 -4px;} .stack-click:active{background:var(--brand-soft);}
  .pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:7px;}
  .pill.up{background:var(--pos-l);color:#15803d;} .pill.no{background:var(--neg-l);color:var(--neg);} .pill.wait{background:#f1f5f9;color:var(--muted);}
  .rank{width:25px;height:25px;border-radius:8px;background:var(--bg);color:var(--slate);font-weight:800;font-size:13px;display:grid;place-items:center;flex-shrink:0;}
  .rank.top{background:var(--amber-l);color:var(--amber);}
  label.fld{display:block;font-weight:600;font-size:14px;margin:12px 2px 6px;color:var(--ink2);}
  input.txt,select.txt{width:100%;padding:13px;font-size:16px;font-family:inherit;border:1px solid var(--line);border-radius:12px;outline:none;font-weight:500;background:#fff;}
  input.txt:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--brand-l);}
  .img-drop{border:1.5px dashed var(--brand2);border-radius:13px;padding:16px;text-align:center;color:var(--brand);font-weight:600;cursor:pointer;background:var(--brand-soft);font-size:14px;}
  .img-preview{width:100%;height:120px;object-fit:cover;border-radius:12px;margin-top:10px;}
  .chips{display:flex;gap:8px;} .chips button{flex:1;border:1px solid var(--line);background:#fff;padding:11px 6px;border-radius:12px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);line-height:1.25;}
  .chips button.active{background:var(--brand);color:#fff;border-color:var(--brand);} .chips button:disabled{cursor:not-allowed;} .chips.day button.active{background:var(--info);border-color:var(--info);}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px;box-shadow:var(--sh-sm);}
  .grp-pick{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .grp-pick span{font-size:13.5px;font-weight:700;color:var(--ink2);}
  .grp-pick select{flex:1;font-family:inherit;font-size:14.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);border:1px solid var(--brand);border-radius:11px;padding:11px 12px;cursor:pointer;-webkit-appearance:menulist;appearance:menulist;}
  .seg button{flex:1;border:none;background:none;font-family:inherit;padding:9px 4px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;} .seg button.active{background:var(--brand);color:#fff;}
  .menu-manage{display:flex;align-items:center;gap:11px;padding:9px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;}
  .menu-manage .em{width:44px;height:44px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex-shrink:0;overflow:hidden;cursor:pointer;} .menu-manage .em img{width:100%;height:100%;object-fit:cover;}
  .hint{background:var(--info-l);color:#075985;padding:11px 13px;border-radius:12px;font-size:12.5px;font-weight:500;margin-bottom:12px;line-height:1.5;}
  .hide{display:none!important;} .caption{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;}
  .del{color:var(--neg);background:none;border:none;font-size:18px;cursor:pointer;padding:4px 7px;} .note{color:var(--muted);font-size:12px;text-align:center;padding:8px;} .home-name{font-size:20px;font-weight:800;line-height:1.25;color:var(--brand);letter-spacing:-.3px;} .home-co{font-size:13px;color:var(--muted);margin-top:5px;font-weight:600;}
  .admin-link{display:block;margin:16px auto 0;background:none;border:none;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;opacity:.75;text-decoration:underline;}
  .fb-q{padding:13px 2px;border-bottom:1px solid var(--line);} .fb-q:last-child{border-bottom:none;}
  .fb-qh{font-weight:700;font-size:15px;text-align:center;}
  .stars{display:flex;gap:6px;margin:9px 0 3px;justify-content:center;}
  .star{font-size:36px;color:#e2e8f0;cursor:pointer;transition:.1s;line-height:1;}
  .star.on{color:#f59e0b;} .star:active{transform:scale(1.18);}
  .fb-scale{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;}
  textarea.txt{width:100%;padding:13px;font-size:15px;font-family:inherit;border:1px solid var(--line);border-radius:12px;outline:none;font-weight:500;background:#fff;resize:vertical;min-height:72px;}
  textarea.txt:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--brand-l);}
  .grid{width:100%;border-collapse:collapse;font-size:14px;}
  .grid th{background:var(--brand);color:#fff;font-weight:700;padding:8px 3px;font-size:12px;border:1px solid #0b3a78;line-height:1.15;}
  .grid td{border:1px solid var(--line);padding:9px 3px;text-align:center;}
  .grid .dcell{font-weight:700;text-align:left;padding-left:8px;background:var(--bg);font-size:12.5px;}
  .grid .ncell{font-weight:800;font-size:16px;color:var(--brand);}
  .grid .tcell{font-weight:800;background:#fef3c7;color:#b45309;}
  .grid .totrow td{background:#dbeafe;font-weight:800;color:var(--brand);}
  .grid .rw-sub{display:block;font-size:10.5px;font-weight:700;color:#0A63B0;margin-top:2px;line-height:1.1;}
</style>
</head>
<body>
<div id="splashScreen" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(170deg,#062F6E 0%,#0A63B0 45%,#00AEEF 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s">
  <div style="position:relative;margin-bottom:36px">
    <div id="splashIcon" style="width:96px;height:96px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.35);overflow:hidden;animation:splashPop .6s ease-out both"></div>
  </div>
  <div style="color:#fff;font-weight:700;font-size:17px;margin-bottom:6px;opacity:.95;animation:splashFade .8s .3s both">ลงทะเบียนอาหารโรงครัว</div>

      img += '"';
      img += '\u0020height="';

      var black = Array(cellSize+1).join('  ');

function thDateISO(iso){const d=new Date(iso+'T00:00:00');return{dow:THDOW[d.getDay()],short:d.getDate()+' '+THMON[d.getMonth()],ymd:(d.getFullYear()+543)};}

const CI_WINDOWS={breakfast:['06:30','08:00'],lunch:['11:55','13:10'],dinner:['16:00','18:30']};
function thNow(){const d=new Date(Date.now()+(7*60+new Date().getTimezoneOffset())*60000);const p=n=>String(n).padStart(2,'0');return{date:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),hm:p(d.getHours())+':'+p(d.getMinutes())};}
function currentMealWindow(){const n=thNow();for(const m of MEALS){const w=CI_WINDOWS[m[0]];if(n.hm>=w[0]&&n.hm<=w[1])return m[0];}return null;}
function mealLabel(mk){const m=MEALS.find(x=>x[0]===mk);return m?m[1]:mk;}
let checkins={}; /* {dateISO:{breakfast:n,lunch:n,dinner:n}} */
function ciGet(date,mk){return (checkins[date]||{})[mk]||0;}
function ciAdd(date,mk){checkins[date]=checkins[date]||{};checkins[date][mk]=(checkins[date][mk]||0)+1;}
function seedCheckins(){checkins={};menuDays.forEach((day,di)=>{MEALS.forEach(m=>{const eat=cellStat(di,m[0]).eat;if(eat){checkins[day.dateISO]=checkins[day.dateISO]||{};checkins[day.dateISO][m[0]]=Math.round(eat*(0.70+((di*3+m[0].length)%6)*0.05));}});});}

function doCheckin(){const mk=currentMealWindow();
  if(!mk){ciResult={status:'closed'};}
  else{const di=menuDays.findIndex(d=>d.dateISO===thNow().date);
    if(di<0){ciResult={status:'noday',meal:mk};}
    else if(!(menuDays[di].meals[mk]||[]).length){ciResult={status:'nomenu',meal:mk};}
    else{let dup=false;const key='canteen_ci_'+thNow().date+'_'+mk;try{dup=!!localStorage.getItem(key);}catch(e){}
      if(dup){ciResult={status:'dup',meal:mk};}
      else{ciAdd(thNow().date,mk);apiPost('checkin',{date:thNow().date,meal:mk});try{localStorage.setItem(key,'1');}catch(e){}ciResult={status:'ok',meal:mk};}}}
  go('checkin');}

/* เมนูวันนี้ — แสดงตามช่วงเวลา (เวลาไทย): ≤08:00 ทั้ง 3 คาบ · ≤13:00 เที่ยง+เย็น · ≤18:00 เย็น · หลัง 18:00 วันถัดไป */
function todayMenuInfo(){const n=thNow();let meals=['breakfast','lunch','dinner'],nextDay=false;
  if(n.hm>'18:00')nextDay=true;
  else if(n.hm>'13:00')meals=['dinner'];
  else if(n.hm>'08:00')meals=['lunch','dinner'];
  let di=menuDays.findIndex(d=>d.dateISO===n.date);
  if(nextDay){di=(di>=0)?di+1:menuDays.findIndex(d=>d.dateISO>n.date);meals=['breakfast','lunch','dinner'];}
  else if(di<0){di=menuDays.findIndex(d=>d.dateISO>n.date);if(di>=0)meals=['breakfast','lunch','dinner'];nextDay=di>=0;}
  if(di<0||di>=menuDays.length)return null;
  return {di:di,meals:meals,nextDay:nextDay};}

function mvDays(){const map={};const _td=thNow().date;
  (histRounds||[]).forEach(function(h){(h.menuDays||[]).forEach(function(d){if(d&&d.dateISO&&!map[d.dateISO])map[d.dateISO]={dateISO:d.dateISO,meals:d.meals||{},cur:false};});});
  (menuDays||[]).forEach(function(d){if(d&&d.dateISO)map[d.dateISO]={dateISO:d.dateISO,meals:d.meals||{},cur:true};});
  return Object.keys(map).filter(function(k){return k>=_td;}).sort().map(function(k){return map[k];})
    .filter(function(d){return MEALS.some(function(m){return (d.meals[m[0]]||[]).length>0;});});}

function regComplete(code){const e=employees.find(x=>x.code===code);if(!e)return false;const rec=registrations[code];if(!rec)return false;let any=false,all=true;menuDays.forEach((_,di)=>{const am=availMealsFor(e,di);if(!am.length)return;const r=rec[di]||{};am.forEach(m=>{if(m[0] in r)any=true;else all=false;});});return any&&all;}
function firstIncompleteDay(code){const e=employees.find(x=>x.code===code);for(let di=0;di<menuDays.length;di++){const am=availMealsFor(e,di);if(!am.length)continue;const r=(registrations[code]||{})[di]||{};if(!am.every(m=>m[0] in r))return di;}return 0;}

function seedRegs(){registrations={};employees.forEach((e,i)=>{registrations[e.code]={};if(i%13===5||i%7===3)return;menuDays.forEach((day,di)=>{if((i*7+di*13)%10<8){registrations[e.code][di]=e.daily?{lunch:((i*3+di)%9)!==0}:{breakfast:((i+di)%3)!==0,lunch:((i*3+di)%9)!==0,dinner:((i+di*2)%4)!==0};}});});}

function seedHistory(){histRounds=[];const s=ymd(addDays(startDate,-4));const md=JSON.parse(JSON.stringify(menuDays)).map((d,i)=>({dateISO:ymd(addDays(s,i)),meals:d.meals}));const regs={};employees.forEach((e,i)=>{if(i%5===4)return;regs[e.code]={};md.forEach((_,di)=>{if((i*3+di*7)%10<9)regs[e.code][di]=e.daily?{lunch:((i*2+di)%5)!==0}:{breakfast:((i+di)%4)!==0,lunch:((i*2+di)%5)!==0,dinner:((i+di)%3)!==0};});});histRounds.push({startDate:s,rounds:md.length,menuDays:md,registrations:regs});}
function captureSnap(){if(snapCaptured)return;const hasData=menuDays.some(d=>MEALS.some(m=>(d.meals[m[0]]||[]).length))&&Object.values(registrations).some(d=>Object.keys(d).length);if(hasData)pendingSnap={startDate:startDate,rounds:rounds,menuDays:JSON.parse(JSON.stringify(menuDays)),registrations:JSON.parse(JSON.stringify(registrations))};snapCaptured=true;}

   ใส่ URL ของ Google Apps Script Web App ที่นี่ (ลงท้ายด้วย /exec)

const API_URL = 'https://script.google.com/macros/s/AKfycbzFXgTliQIklmbnypdoAQTJ4q_NTRqjhAQKZvK6fwqbzOChR3a_POURzGhPRqxlBK9T/exec';
function apiEnabled(){return !!API_URL;}
function apiGetState(){return fetch(API_URL+'?action=state',{cache:'no-store'}).then(r=>r.json());}
function apiPost(action,data){if(!apiEnabled())return Promise.resolve({ok:true});
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action},data))})
    .then(r=>r.json()).catch(err=>{console.warn('sync failed',err);toast('⚠️ ซิงก์ข้อมูลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต');return{ok:false,error:String(err)};});}
function emptyMenuDays(){const arr=[];for(let i=0;i<rounds;i++)arr.push({dateISO:ymd(addDays(startDate,i)),meals:{breakfast:[],lunch:[],dinner:[]}});return arr;}
/* Google Sheet อาจแปลงช่องวันที่เป็น Date object — แปลงกลับเป็น YYYY-MM-DD เสมอ */
function isoDateStr(v){if(!v)return '';const s=String(v);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);if(isNaN(d.getTime()))return '';const b=new Date(d.getTime()+7*3600*1000);const p=n=>String(n).padStart(2,'0');return b.getUTCFullYear()+'-'+p(b.getUTCMonth()+1)+'-'+p(b.getUTCDate());}
/* แคชข้อมูลล่าสุดไว้ในเครื่อง เพื่อให้เปิดแอปแล้วเห็นเมนูทันที ไม่ต้องรอเน็ต */
const LS_STATE='canteen_state_cache';
function stripImgs(st){try{const c=JSON.parse(JSON.stringify(st));
  const rm=function(menu){Object.keys(menu||{}).forEach(function(di){Object.keys(menu[di]||{}).forEach(function(mk){(menu[di][mk]||[]).forEach(function(it){if(it&&it.img)delete it.img;});});});};
  rm(c.menu);(c.history||[]).forEach(function(h){rm(h.menu);});return c;}catch(e){return st;}}
function saveStateCache(st){try{localStorage.setItem(LS_STATE,JSON.stringify(st));}catch(e){try{localStorage.setItem(LS_STATE,JSON.stringify(stripImgs(st)));}catch(e2){}}}
function loadStateCache(){try{const s=localStorage.getItem(LS_STATE);return s?JSON.parse(s):null;}catch(e){return null;}}
function applyStateFromAPI(st){rounds=st.rounds||rounds;startDate=isoDateStr(st.startDate)||startDate;
  regGen=(st.regGen===undefined||st.regGen===null)?regGen:(Number(st.regGen)||0);
  menuDays=emptyMenuDays();
  const menu=st.menu||{};
  Object.keys(menu).forEach(di=>{const d=Number(di);if(!menuDays[d])return;Object.keys(menu[di]).forEach(mk=>{menuDays[d].meals[mk]=menu[di][mk]||[];});});
  menuReady=Object.keys(menu).length>0;
  menuPublished=(st.menuPub===undefined||st.menuPub===null||st.menuPub==='')?true:!!Number(st.menuPub);
  registrations={};
  const regs=st.registrations||{};
  Object.keys(regs).forEach(code=>{registrations[code]={};Object.keys(regs[code]).forEach(di=>{registrations[code][Number(di)]=regs[code][di];});});
  histRounds=[];
  (st.history||[]).forEach(h0=>{const h=Object.assign({},h0,{startDate:isoDateStr(h0.startDate)||h0.startDate});if(!isoDateStr(h.startDate))return;const days=[];for(let i=0;i<(h.rounds||0);i++)days.push({dateISO:ymd(addDays(h.startDate,i)),meals:{breakfast:[],lunch:[],dinner:[]}});
    Object.keys(h.menu||{}).forEach(di=>{const d=Number(di);if(!days[d])return;Object.keys(h.menu[di]).forEach(mk=>{days[d].meals[mk]=h.menu[di][mk]||[];});});
    const hr={};Object.keys(h.registrations||{}).forEach(c=>{hr[c]={};Object.keys(h.registrations[c]).forEach(di=>{hr[c][Number(di)]=h.registrations[c][di];});});
    histRounds.push({startDate:h.startDate,rounds:h.rounds,menuDays:days,registrations:hr});});
  checkins={};Object.keys(st.checkins||{}).forEach(d=>{const k=isoDateStr(d);if(k)checkins[k]=st.checkins[d];});
  saveStateCache(st);
}

function regDoneMark(code){try{const m=regDoneMap();const k=regRoundKey();m[k]=m[k]||[];if(!m[k].includes(code))m[k].push(code);localStorage.setItem('canteen_reg_done',JSON.stringify(m));}catch(e){}}

function confirmDay(){const di=regDayIdx,am=availMealsFor(currentUser,di),rec=(registrations[currentUser.code]||{})[di]||{};if(!am.every(m=>m[0] in rec)){toast('กรุณาเลือกให้ครบทุกคาบ');return;}

/* ส่งข้อมูลทั้งรอบ "ครั้งเดียว" (atomic) — server เก็บครบทุกวันหรือไม่เก็บเลย ไม่มีทางลงไม่ครบ */
function submitRegistration(code){const el=()=>document.getElementById('saveStat');
  if(!apiEnabled()){regDoneMark(code);return;}
  if(el())el().innerHTML='<span style="color:var(--muted)">⏳ กำลังบันทึกลงฐานข้อมูล...</span>';
  const days={};menuDays.forEach((_,di)=>{const r=(registrations[code]||{})[di];if(r&&Object.keys(r).length)days[di]=r;});

  <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="keyNewPin('${n}')">${n}</button>`).join('')}<button class="act" onclick="keyNewPin('del')">⌫</button><button onclick="keyNewPin('0')">0</button><button class="act" onclick="keyNewPin('del')">⌫</button></div>
  <div class="note">รหัสจะถูกเก็บไว้ในเครื่องนี้ (ใช้กับหน้าเข้าสู่ระบบผู้ดูแล)</div>`;}
function keyNewPin(k){let buf=npStage==='new'?npNew:npConfirm;if(k==='del')buf=buf.slice(0,-1);else if(buf.length<4)buf+=k;if(npStage==='new')npNew=buf;else npConfirm=buf;
  if(buf.length===4&&k!=='del'){if(npStage==='new'){setTimeout(()=>{npStage='confirm';render();},130);return;}else{if(npConfirm===npNew){setPINstore(npNew);toast('บันทึก PIN ใหม่แล้ว ✓');setTimeout(()=>{npNew='';npConfirm='';npStage='new';go('adminHub');},650);}else{toast('รหัสไม่ตรงกัน ลองใหม่');npNew='';npConfirm='';npStage='new';setTimeout(render,300);}return;}}render();}

/* ===== จัดการพนักงาน (เพิ่ม/ลบ — ยืนยันด้วย PIN) ===== */
let empMgmtMode='add',empDelQ='';
let empForm={code:'',fname:'',lname:'',unit:'',right:''};
function empFormReset(){empForm={code:'',fname:'',lname:'',unit:'',right:''};}
function renderAdminEmp(){
  const seg=`<div class="seg" style="margin-bottom:12px"><button class="${empMgmtMode==='add'?'active':''}" onclick="empMgmtMode='add';renderAdminEmp()">➕ เพิ่มพนักงาน</button><button class="${empMgmtMode==='del'?'active':''}" onclick="empMgmtMode='del';renderAdminEmp()">🗑️ ลบพนักงาน</button></div>`;
  if(empMgmtMode==='add'){
    body().innerHTML=`${seg}<div class="hint">💡 กรอกข้อมูลพนักงานใหม่ให้ครบ แล้วกดยืนยัน (ต้องใส่ PIN)</div>
    <div class="card">
      <label class="fld" style="margin-top:0">รหัสพนักงาน</label><input class="txt" inputmode="numeric" placeholder="เช่น 12345" value="${empForm.code}" oninput="empForm.code=this.value.trim()">
      <label class="fld">ชื่อ</label><input class="txt" placeholder="ชื่อ" value="${empForm.fname}" oninput="empForm.fname=this.value">
      <label class="fld">นามสกุล</label><input class="txt" placeholder="นามสกุล" value="${empForm.lname}" oninput="empForm.lname=this.value">
      <label class="fld">หน่วยงาน</label><select class="txt" onchange="empForm.unit=this.value"><option value="">— เลือกหน่วยงาน —</option>${UNITS.map(u=>`<option value="${u}" ${empForm.unit===u?'selected':''}>${u}</option>`).join('')}</select>
      <label class="fld">สิทธิ์ <span style="color:var(--neg)">*สำคัญ</span></label><select class="txt" onchange="empForm.right=this.value"><option value="">— เลือกสิทธิ์ —</option><option value="reg" ${empForm.right==='reg'?'selected':''}>ระดับ 4+ (ครบ 3 คาบ)</option><option value="daily" ${empForm.right==='daily'?'selected':''}>รายวัน - ระดับ 3 (เฉพาะคาบเที่ยง)</option></select>
    </div>
    <button class="btn btn-brand" onclick="addEmpConfirm()">✓ ยืนยันการเพิ่มพนักงาน</button>
    <div class="note">สิทธิ์มีผลต่อการจัดเก็บข้อมูล: ระดับ 4+ ลงได้ 3 คาบ · รายวันลงได้เฉพาะคาบเที่ยง</div>`;
  } else {
    body().innerHTML=`${seg}<div class="hint" style="background:var(--neg-l);color:#991b1b">⚠️ การลบจะนำพนักงานออกจากฐานข้อมูล ต้องยืนยันด้วย PIN ทุกครั้ง</div>
    <div class="search-wrap"><span class="ic">🔍</span><input id="empDelQ" placeholder="ค้นหาชื่อ หรือ รหัสพนักงาน" value="${empDelQ}" oninput="empDelQ=this.value;drawEmpDelList()" autocomplete="off"></div>
    <div class="card" id="empDelList" style="padding:6px"></div>
    <div class="note" id="empDelNote"></div>`;
    drawEmpDelList();setTimeout(()=>{const el=document.getElementById('empDelQ');if(el)el.focus();},50);

}
function drawEmpDelList(){const q=empDelQ.trim().toLowerCase();const list=employees.filter(e=>!q||e.code.includes(q)||e.name.toLowerCase().includes(q)||(e.unit||'').toLowerCase().includes(q)).slice(0,8);
  const el=document.getElementById('empDelList');if(!el)return;
  el.innerHTML=list.length?list.map(e=>`<div class="emp-item"><div style="flex:1"><div class="nm">${e.name}</div><div class="dp">${e.unit||e.dept}${e.daily?' · 👷 รายวัน':' · ระดับ 4+'}</div></div><span class="code-badge">${e.code}</span><button onclick="delEmpAsk('${e.code}')" style="margin-left:8px;background:var(--neg-l);color:var(--neg);border:none;border-radius:10px;padding:8px 13px;font-weight:800;font-size:13px;font-family:inherit;cursor:pointer">ลบ</button></div>`).join(''):`<div class="note" style="padding:22px">ไม่พบพนักงาน</div>`;
  const nt=document.getElementById('empDelNote');if(nt)nt.textContent=`พนักงานทั้งหมด ${employees.length} คน (ประจำ ${REG_EMPS.length} · รายวัน ${DAILY_EMPS.length})`;}
function addEmpConfirm(){
  const code=empForm.code,name=(empForm.fname.trim()+' '+empForm.lname.trim()).trim();
  if(!code){toast('กรุณาใส่รหัสพนักงาน');return;}
  if(employees.some(e=>e.code===code)){showPopup('⚠️','รหัสนี้มีอยู่แล้ว',`รหัส ${code} ถูกใช้โดย<br><b>${employees.find(e=>e.code===code).name}</b>`);return;}
  if(!empForm.fname.trim()){toast('กรุณาใส่ชื่อ');return;}
  if(!empForm.unit){toast('กรุณาเลือกหน่วยงาน');return;}
  if(!empForm.right){toast('กรุณาเลือกสิทธิ์');return;}
  const daily=empForm.right==='daily';
  askPIN('ยืนยันการเพิ่มพนักงาน',`<b>${name}</b> · รหัส ${code}<br>${empForm.unit} · ${daily?'รายวัน - ระดับ 3 (เฉพาะเที่ยง)':'ระดับ 4+'}<br>ใส่ PIN ผู้ดูแลเพื่อยืนยัน`,()=>{
    EMP_ADD.push({code:code,name:name,dept:empForm.unit,unit:empForm.unit,daily:daily});
    saveEmpEdits();buildEmployees();empFormReset();renderAdminEmp();
    toast('เพิ่มพนักงานแล้ว ✓');});}
function delEmpAsk(code){const e=employees.find(x=>x.code===code);if(!e)return;
  askPIN('ยืนยันการลบพนักงาน',`<b>${e.name}</b> · รหัส ${code}<br>${e.unit||e.dept}<br>ใส่ PIN ผู้ดูแลเพื่อยืนยันการลบ`,()=>{
    const i=EMP_ADD.findIndex(a=>a.code===code);
    if(i>=0)EMP_ADD.splice(i,1);else EMP_DEL.push(code);
    saveEmpEdits();buildEmployees();drawEmpDelList();
    toast('ลบพนักงานแล้ว ✓');});}

/* ===== หน้า QR เช็คอิน (สำหรับพิมพ์ไปติดหน้าโรงอาหาร) ===== */
function ciUrl(){return location.href.split('?')[0].split('#')[0]+'?checkin=1';}
function renderAdminQR(){const url=ciUrl();const isFile=location.protocol==='file:';
  const winRows=MEALS.map(m=>`<div class="row-item"><span style="font-size:19px">${m[2]}</span><span style="flex:1;font-weight:600">${m[1]}</span><span style="font-weight:700;color:var(--ink2)">${CI_WINDOWS[m[0]][0]} – ${CI_WINDOWS[m[0]][1]} น.</span></div>`).join('');
  body().innerHTML=`<div class="hint">📌 พิมพ์ QR นี้ไปติดหน้าโรงอาหารทุกจุด — พนักงานสแกนเพื่อยืนยันว่า "มาทานจริง" ดูผลในแดชบอร์ด แท็บ "มาจริง"</div>
  ${isFile
    ?`<div class="card" style="text-align:center;padding:28px 20px"><div style="width:190px;height:190px;margin:0 auto;border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;background:var(--bg)"><div style="font-size:44px">🧾</div></div><div style="font-weight:800;font-size:16.5px;margin-top:14px">QR จะแสดงเมื่อเปิดจากลิงก์จริง</div><div style="color:var(--muted);font-size:13px;line-height:1.8;margin-top:6px">นำแอปขึ้นลิงก์ https ก่อน (ตามคู่มือติดตั้งแอปมือถือ)<br>แล้วเปิดหน้านี้จากลิงก์นั้น QR จะขึ้นให้อัตโนมัติ</div></div>`
    :`<div class="card" style="text-align:center;padding:24px 20px"><div id="qrbox" style="display:inline-block;padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-sm)"></div><div style="font-weight:800;font-size:17px;margin-top:12px">สแกนเมื่อมาถึงโรงอาหาร 🍚</div><div style="color:var(--muted);font-size:12.5px;margin-top:4px">สแกนซ้ำในคาบเดียวกันจากเครื่องเดิม ระบบไม่นับเพิ่ม</div></div>`}
  <div class="card"><div class="sec-title">⏱ ช่วงเวลาที่สแกนได้ (เวลาไทย)</div>${winRows}</div>
  ${isFile?'':'<button class="btn btn-brand" onclick="downloadQRPoster()">📤 แชร์ / บันทึกภาพโปสเตอร์ QR (ไปพิมพ์)</button>'}
  <button class="btn btn-ghost" onclick="go('adminHub')">‹ กลับเมนูผู้ดูแล</button>`;
  if(!isFile){try{const qr=qrcode(0,'M');qr.addData(url);qr.make();const img=qr.createImgTag(5,4);document.getElementById('qrbox').innerHTML=img.replace('<img ','<img style="width:210px;height:210px;image-rendering:pixelated" ');}catch(e){document.getElementById('qrbox').innerHTML='<div class="note">สร้าง QR ไม่สำเร็จ</div>';}}}
function downloadQRPoster(){const url=ciUrl();const W=800,H=930,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#062F6E';x.fillRect(0,0,W,130);
  x.textBaseline='middle';x.textAlign='center';x.fillStyle='#fff';x.font="800 34px 'IBM Plex Sans Thai','Sarabun',sans-serif";x.fillText('สแกนยืนยัน "มาทานจริง" 🍚',W/2,52);
  x.font="500 20px 'IBM Plex Sans Thai',sans-serif";x.fillStyle='#cfe9fb';x.fillText('โรงครัวมิตรลาว · สแกนทุกครั้งที่มาใช้สิทธิ์',W/2,94);
  const qr=qrcode(0,'M');qr.addData(url);qr.make();const n=qr.getModuleCount();const size=520,cell=size/n,ox=(W-size)/2,oy=170;
  x.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))x.fillRect(ox+c*cell,oy+r*cell,cell+0.5,cell+0.5);
  let yy=oy+size+58;x.fillStyle='#0f172a';x.font="800 27px 'IBM Plex Sans Thai',sans-serif";x.fillText('สแกนก่อนรับอาหารทุกครั้ง',W/2,yy);
  x.fillStyle='#94a3b8';x.font="500 16px 'IBM Plex Sans Thai',sans-serif";x.fillText('1 เครื่อง สแกนได้ 1 ครั้งต่อคาบ · จากแอปลงทะเบียนอาหารโรงครัว',W/2,H-36);
  shareCanvas(cv);}

function renderMList(){document.getElementById('mList').innerHTML=menuDays.map((dd,di)=>{const d=thDateISO(dd.dateISO);const meals=MEALS.filter(m=>(dd.meals[m[0]]||[]).length).map(m=>dd.meals[m[0]].map((x,idx)=>`<div class="menu-manage"><div class="em" ${x.img?`onclick="openLightbox(menuDays[${di}].meals['${m[0]}'][${idx}].img)"`:''}>${x.img?`<img src="${x.img}">`:x.emoji}</div><div style="flex:1"><div style="font-weight:600">${x.name}</div><div style="color:var(--muted);font-size:12.5px">${m[2]} ${m[1]}${x.img?' · 📷 มีรูป (กดดู)':''}</div></div><button class="del" style="background:var(--info-l);color:var(--info);margin-right:6px" onclick="editItem(${di},'${m[0]}',${idx})">✏️</button><button class="del" onclick="delItem(${di},'${m[0]}',${idx})">🗑</button></div>`).join('')).join('');return `<div style="margin-bottom:6px"><div style="font-weight:700;font-size:13px;color:var(--info);margin:8px 2px">${d.dow} ${d.short}</div>${meals||'<div class="note" style="text-align:left;padding:4px">— ยังไม่มีเมนู —</div>'}</div>`;}).join('');}

function aggMeal(){const c={breakfast:0,lunch:0,dinner:0};Object.values(registrations).forEach(days=>Object.values(days).forEach(r=>MEALS.forEach(m=>{if(r[m[0]])c[m[0]]++;})));return c;}
function aggDay(){return menuDays.map((day,di)=>{let n=0;Object.values(registrations).forEach(days=>{const r=days[di];if(r)MEALS.forEach(m=>{if(r[m[0]])n++;});});return{label:thDateISO(day.dateISO).dow.slice(0,2)+' '+thDateISO(day.dateISO).short,val:n};});}
function aggDept(){const c={};DEPTS.forEach(d=>c[d]=0);employees.forEach(e=>{const days=registrations[e.code]||{};Object.values(days).forEach(r=>MEALS.forEach(m=>{if(r[m[0]])c[e.dept]++;}));});return Object.entries(c).map(([k,v])=>({label:k,val:v})).sort((a,b)=>b.val-a.val);}
function aggMenu(){const arr=[];menuDays.forEach((day,di)=>{const d=thDateISO(day.dateISO);MEALS.forEach(m=>{const items=day.meals[m[0]]||[];if(!items.length)return;let n=0;Object.values(registrations).forEach(days=>{const r=days[di];if(r&&r[m[0]])n++;});arr.push({label:items.map(x=>x.name).join(' / '),sub:`${d.dow.slice(0,2)} · ${m[1]}`,emoji:items[0].emoji,img:items[0].img,val:n});});});return arr.sort((a,b)=>b.val-a.val);}
function aggPerson(){return employees.map(e=>{const days=registrations[e.code]||{};let reg=0;Object.values(days).forEach(r=>MEALS.forEach(m=>{if(m[0] in r)reg++;}));return{e,reg};}).sort((a,b)=>b.reg-a.reg);}
function aggPersonByMode(mode){return employees.map(e=>{const days=registrations[e.code]||{};let cnt=0;if(mode==='eat'){Object.values(days).forEach(r=>MEALS.forEach(m=>{if(r[m[0]])cnt++;}));}else if(mode==='no'){Object.values(days).forEach(r=>MEALS.forEach(m=>{if(m[0] in r&&!r[m[0]])cnt++;}));}else{Object.values(days).forEach(r=>MEALS.forEach(m=>{if(m[0] in r)cnt++;}));}return{e,reg:cnt};}).sort((a,b)=>b.reg-a.reg);}

let dashUpdated='',dashTimer=null;
function nowClock(){const n=new Date(Date.now()+(7*60+new Date().getTimezoneOffset())*60000);const p=x=>String(x).padStart(2,'0');return p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());}
function regSig(){let n=0;Object.keys(registrations).forEach(c=>{n+=Object.keys(registrations[c]||{}).length;});return n+'|'+JSON.stringify(checkins).length;}
function refreshDash(manual){
  if(!apiEnabled()){if(manual)toast('โหมดเดโม ไม่มีฐานข้อมูล');return;}
  if(manual)toast('กำลังรีเฟรช...');
  const before=regSig();
  apiGetState().then(function(st){
    try{applyStateFromAPI(st);}catch(e){}
    dashUpdated=nowClock();
    if(screen==='adminDash'){
      if(manual||regSig()!==before){renderAdminDash();}
      else{const u=document.querySelector('.dash-upd');if(u)u.innerHTML='🟢 อัปเดตล่าสุด '+dashUpdated+' · อัตโนมัติทุก 15 วิ';}
    }
    if(manual)toast('อัปเดตข้อมูลล่าสุดแล้ว ✓');
  },function(){if(manual)toast('รีเฟรชไม่สำเร็จ ตรวจอินเทอร์เน็ต');});
}
function startDashPoll(){
  if(!apiEnabled()||dashTimer)return;
  if(!dashUpdated)refreshDash(false);
  dashTimer=setInterval(function(){if(screen!=='adminDash'){stopDashPoll();return;}refreshDash(false);},15000);
}
function stopDashPoll(){if(dashTimer){clearInterval(dashTimer);dashTimer=null;}}
function scopeSeg(){return `<div class="seg" style="margin-bottom:10px"><button class="${dashScope==='current'?'active':''}" onclick="dashScope='current';renderDashBody()">รอบนี้</button><button class="${dashScope==='all'?'active':''}" onclick="dashScope='all';renderDashBody()">สะสมทั้งหมด (${histRounds.length+1} รอบ)</button></div>`;}
function renderDashBody(){const box=document.getElementById('dashBody');
  if(dashTab==='overview'){box.innerHTML=`<div class="card"><div class="sec-title">จำนวนคนที่จะมาทาน · พนักงานระดับ 4+ (คน)<span class="cap">วัน × คาบ · รวม ${REG_EMPS.length} คน</span><button class="share-ic save-ic" onclick="shareGrid('reg','save')" title="บันทึกเป็น JPG">💾</button><button class="share-ic" onclick="shareGrid('reg','share')" title="แชร์เป็นภาพ">📤</button></div>${gridFor(REG_EMPS,MEALS)}</div><div class="card"><div class="sec-title">จำนวนคนที่จะมาทาน · พนักงานรายวัน (ระดับ 3) (คน)<span class="cap">เฉพาะเที่ยง · รวม ${DAILY_EMPS.length} คน</span><button class="share-ic save-ic" onclick="shareGrid('daily','save')" title="บันทึกเป็น JPG">💾</button><button class="share-ic" onclick="shareGrid('daily','share')" title="แชร์เป็นภาพ">📤</button></div>${gridFor(DAILY_EMPS,MEALS.filter(m=>m[0]==='lunch'))}</div><div class="card"><div class="sec-title">สถานะการมาใช้สิทธิ์ของพนักงาน ระดับ 4+<span class="cap">รวม ${REG_EMPS.length} คน</span><button class="share-ic save-ic" onclick="shareStatusImage('reg','save')" title="บันทึกเป็น JPG">💾</button><button class="share-ic" onclick="shareStatusImage('reg','share')" title="แชร์เป็นภาพ">📤</button></div>${legendHTML()}${menuDays.map((day,di)=>statusRow(thDateISO(day.dateISO).dow.slice(0,2)+' '+thDateISO(day.dateISO).short,perDayPersonG(di,REG_EMPS))).join('')}</div><div class="card"><div class="sec-title">สถานะการมาใช้สิทธิ์ของพนักงาน รายวัน - ระดับ 3<span class="cap">รวม ${DAILY_EMPS.length} คน · เฉพาะเที่ยง</span><button class="share-ic save-ic" onclick="shareStatusImage('daily','save')" title="บันทึกเป็น JPG">💾</button><button class="share-ic" onclick="shareStatusImage('daily','share')" title="แชร์เป็นภาพ">📤</button></div>${legendHTML()}${menuDays.map((day,di)=>statusRow(thDateISO(day.dateISO).dow.slice(0,2)+' '+thDateISO(day.dateISO).short,perDayPersonG(di,DAILY_EMPS))).join('')}</div>`;}
  else if(dashTab==='menu'){const rows=aggMenuScope(dashScope),max=Math.max(...rows.map(r=>r.val),1);box.innerHTML=`${scopeSeg()}<div class="card"><div class="sec-title">เมนูยอดฮิต<span class="cap">จำนวนครั้งที่ถูกเลือกทาน · สะสม</span></div>${rows.map((r,i)=>`<div class="row-item"><span class="rank ${i===0?'top':''}">${i+1}</span><div style="width:36px;height:36px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-size:20px;overflow:hidden">${r.img?`<img src="${r.img}" style="width:100%;height:100%;object-fit:cover">`:r.emoji}</div><div style="flex:1"><div style="font-weight:600;font-size:13.5px">${r.label}</div><div style="color:var(--muted);font-size:11px;margin-top:2px">${mealLabel(r.meal)}</div><div style="height:7px;background:var(--line);border-radius:5px;margin-top:4px;overflow:hidden"><div style="height:100%;width:${r.val/max*100}%;background:var(--brand);border-radius:5px"></div></div></div><div style="font-weight:800">${r.val} <span style="font-weight:500;font-size:11px;color:var(--muted)">ครั้ง</span></div></div>`).join('')||'<div class="note">ยังไม่มีข้อมูล</div>'}</div>`;}
  else if(dashTab==='unit'){box.innerHTML=`<div class="seg" style="margin-bottom:10px"><button class="${dashUnitMode==='reg'?'active':''}" onclick="dashUnitMode='reg';renderDashBody()">ลงทะเบียน</button><button class="${dashUnitMode==='eat'?'active':''}" onclick="dashUnitMode='eat';renderDashBody()">ทาน</button></div><div class="search-wrap"><span class="ic">🔍</span><input id="unitQ" placeholder="ค้นหาหน่วยงาน" value="${unitQuery}" oninput="unitQuery=this.value;redrawUnit()"></div><div class="card"><div class="sec-title" id="unitTitle"></div><canvas id="ch" width="600" height="440" style="width:100%;height:auto"></canvas></div><div class="note" id="unitNote"></div>`;redrawUnit();}
  else if(dashTab==='actual'){let gE=0,gC=0;
    const dayCards=menuDays.map((day,di)=>{const d=thDateISO(day.dateISO);let dE=0,dC=0;
      const rows=MEALS.filter(m=>(day.meals[m[0]]||[]).length>0).map(m=>{const E=cellStat(di,m[0]).eat,C=ciGet(day.dateISO,m[0]);dE+=E;dC+=C;const pct=E?Math.round(C/E*100):0;
        return `<div class="row-item"><span style="font-size:19px">${m[2]}</span><div style="flex:1"><div style="font-weight:600;font-size:13.5px">${m[1]}</div><div style="font-size:12px;color:var(--muted)">ลงว่าทาน ${E} · มาสแกน ${C} คน</div></div><span class="pill ${pct>=85?'up':pct>=60?'':'no'}" style="${pct>=60&&pct<85?'background:var(--amber-l);color:var(--amber)':''}">${pct}%</span></div>`;}).join('');
      gE+=dE;gC+=dC;const dp=dE?Math.round(dC/dE*100):0;
      return `<div class="card"><div class="sec-title">${d.dow} ${d.short}<span class="cap">รวมวัน ${dC}/${dE} = ${dp}%</span></div>${rows||'<div class="note">ยังไม่มีเมนู</div>'}</div>`;}).join('');
    const gp=gE?Math.round(gC/gE*100):0;
    box.innerHTML=`<div class="hint">🧾 เทียบ "ลงทะเบียนว่าทาน" กับ "มาสแกน QR จริง" คาบต่อคาบ (รอบปัจจุบัน)</div>
    <div class="kpi-row"><div class="kpi"><div style="font-size:12px;color:var(--muted);font-weight:600">ลงว่าทาน (ทั้งรอบ)</div><div style="font-size:26px;font-weight:800;color:var(--brand)">${gE}</div></div><div class="kpi"><div style="font-size:12px;color:var(--muted);font-weight:600">มาใช้จริง (สแกน)</div><div style="font-size:26px;font-weight:800;color:${gp>=85?'var(--pos)':gp>=60?'var(--amber)':'var(--neg)'}">${gC} <span style="font-size:15px">(${gp}%)</span></div></div></div>
    ${dayCards}<div class="note">ข้อมูลสแกนมาจาก QR หน้าโรงอาหาร · เปิดสแกนตามช่วงเวลา: เช้า ${CI_WINDOWS.breakfast[0]}–${CI_WINDOWS.breakfast[1]} · เที่ยง ${CI_WINDOWS.lunch[0]}–${CI_WINDOWS.lunch[1]} · เย็น ${CI_WINDOWS.dinner[0]}–${CI_WINDOWS.dinner[1]} น.</div>`;}
  else{const rows=sortPersons(personStats());const mL={reg:'% ลงทะเบียน',eat:'% ทาน',no:'% ไม่ทาน'};const gL={all:'ทุกกลุ่ม',reg:'ระดับ 4+',daily:'รายวัน ระดับ 3'};box.innerHTML=`<div class="grp-pick"><span>👥 กลุ่ม</span><select onchange="dashPersonGroup=this.value;renderDashBody()"><option value="all"${dashPersonGroup==='all'?' selected':''}>ทุกกลุ่ม (${employees.length} คน)</option><option value="reg"${dashPersonGroup==='reg'?' selected':''}>ระดับ 4+ (${REG_EMPS.length} คน)</option><option value="daily"${dashPersonGroup==='daily'?' selected':''}>รายวัน ระดับ 3 (${DAILY_EMPS.length} คน)</option></select></div><div class="seg" style="margin-bottom:10px"><button class="${dashPersonMode==='reg'?'active':''}" onclick="dashPersonMode='reg';renderDashBody()">ลงทะเบียน</button><button class="${dashPersonMode==='eat'?'active':''}" onclick="dashPersonMode='eat';renderDashBody()">ทาน</button><button class="${dashPersonMode==='no'?'active':''}" onclick="dashPersonMode='no';renderDashBody()">ไม่ทาน</button></div><div class="search-wrap"><span class="ic">🔍</span><input placeholder="ค้นหาชื่อ/รหัส/หน่วยงาน" oninput="filterPerson(this.value)"></div><div class="card" id="pbox" style="padding:6px">${personRowsDash(rows.slice(0,25))}</div><div class="note">กลุ่ม ${gL[dashPersonGroup]} · รอบปัจจุบัน · % คิดจากคาบทั้งหมดที่มีสิทธิ์ (ระดับ4+ =${menuDays.length}วัน×3 · รายวัน =${menuDays.length}วัน×1) · เรียง${mL[dashPersonMode]}มาก→น้อย · แสดง ${Math.min(25,rows.length)} จาก ${rows.length} คน</div>`;}}
/* หน่วยงาน: คิดเป็น % */
function unitStats(scope){const info={};UNITS.forEach(u=>info[u]={total:0,reg:0,eat:0});employees.forEach(e=>{const inf=info[e.unit];if(!inf)return;inf.total++;let isReg=false,isEat=false;allDatasets(scope).forEach(d=>{const days=d.registrations[e.code]||{};Object.values(days).forEach(r=>MEALS.forEach(m=>{if(m[0] in r){isReg=true;if(r[m[0]])isEat=true;}}));});if(isReg)inf.reg++;if(isEat)inf.eat++;});return info;}
function redrawUnit(){const st=unitStats('all');let rows=Object.entries(st).map(([u,v])=>({label:u,total:v.total,reg:v.reg,eat:v.eat,val:dashUnitMode==='eat'?(v.reg?Math.round(v.eat/v.reg*100):0):(v.total?Math.round(v.reg/v.total*100):0)}));const q=(unitQuery||'').trim().toLowerCase();if(q)rows=rows.filter(r=>r.label.toLowerCase().includes(q));rows.sort((a,b)=>b.val-a.val||b.total-a.total);const shown=rows.slice(0,12);
  const t=document.getElementById('unitTitle');if(t)t.innerHTML=(dashUnitMode==='eat'?'% ทาน · จากคนที่ลงทะเบียนของหน่วย':'% ลงทะเบียน · จากคนทั้งหมดของหน่วย')+`<span class="cap">Top 12 · %</span>`;
  const n=document.getElementById('unitNote');if(n)n.textContent=`คิดจากข้อมูลทั้งหมดทุกรอบ · อ้างอิงคอลัมน์ L (หน่วย) · แสดง ${shown.length} จาก ${rows.length} หน่วยงาน${q?' (ผลค้นหา)':''}`;
  drawBars('ch',shown,v=>v+'%');}
/* รายคน (รอบปัจจุบัน): % คิดจาก "คาบทั้งหมดที่มีสิทธิ์" ของรอบ — ระดับ4+ =วันละ3คาบ · รายวัน =วันละ1(เที่ยง) */
function personGroupList(){return dashPersonGroup==='reg'?REG_EMPS:(dashPersonGroup==='daily'?DAILY_EMPS:employees);}
function personStats(){return personGroupList().map(e=>{let avail=0,reg=0,eatC=0,noC=0;menuDays.forEach((day,di)=>{empMeals(e).forEach(m=>{if(!(day.meals[m[0]]||[]).length)return;avail++;const r=(registrations[e.code]||{})[di];if(r&&(m[0] in r)){reg++;if(r[m[0]])eatC++;else noC++;}});});return{e,avail,reg,regPct:avail?Math.round(reg/avail*100):0,eatC,noC,eatPct:avail?Math.round(eatC/avail*100):0,noPct:avail?Math.round(noC/avail*100):0};});}
function sortPersons(rows){if(dashPersonMode==='eat')rows.sort((a,b)=>b.eatPct-a.eatPct||b.eatC-a.eatC);else if(dashPersonMode==='no')rows.sort((a,b)=>b.noPct-a.noPct||b.noC-a.noC);else rows.sort((a,b)=>b.regPct-a.regPct||b.reg-a.reg);return rows;}
function personPill(r){if(!r.avail)return `<span class="pill wait">ไม่มีคาบสิทธิ์</span>`;
  if(dashPersonMode==='eat')return `<span class="pill up">ทาน ${r.eatPct}% (${r.eatC}/${r.avail} คาบ)</span>`;
  if(dashPersonMode==='no')return `<span class="pill no">ไม่ทาน ${r.noPct}% (${r.noC}/${r.avail} คาบ)</span>`;
  /* ลงทะเบียน = ครบทั้งรอบเท่านั้น (1 รอบ = 1 ครั้ง) · ลงไม่ครบ = ข้อมูลเข้าไม่ครบ ควรให้ลงใหม่ */
  if(r.reg===0)return `<span class="pill wait">ยังไม่ลงทะเบียน</span>`;
  if(r.reg>=r.avail)return `<span class="pill up">ลงทะเบียนแล้ว ✓</span>`;
  return `<span class="pill" style="background:var(--neg-l);color:var(--neg)">⚠️ ลงไม่ครบ (${r.reg}/${r.avail}) · ให้ลงใหม่</span>`;}
function personRowsDash(rows){return rows.map(r=>`<div class="emp-item" style="cursor:default"><div style="flex:1"><div class="nm" style="font-size:15px">${r.e.name}</div><div class="dp">${r.e.code} · ${r.e.unit}</div></div>${personPill(r)}</div>`).join('');}
function personRows(rows){return rows.map(({e,reg})=>`<div class="emp-item" style="cursor:default"><div style="flex:1"><div class="nm" style="font-size:15px">${e.name}</div><div class="dp">${e.code} · ${e.unit}</div></div><span class="pill ${reg>0?'up':'wait'}">${reg>0?'ลงทะเบียน '+reg+' คาบ':'ยังไม่ลง'}</span></div>`).join('');}
function filterPerson(q){q=(q||'').toLowerCase();const rows=sortPersons(personStats()).filter(r=>r.e.code.includes(q)||r.e.name.toLowerCase().includes(q)||r.e.dept.toLowerCase().includes(q)||r.e.unit.toLowerCase().includes(q)).slice(0,30);document.getElementById('pbox').innerHTML=personRowsDash(rows);}
/* เมนูฮิต: สะสมข้ามรอบ (นับครั้งที่ถูกเลือก "ทาน") */
function aggMenuScope(scope){const map={};allDatasets(scope).forEach(d=>{d.menuDays.forEach((day,di)=>{MEALS.forEach(m=>{const items=day.meals[m[0]]||[];if(!items.length)return;let n=0;Object.values(d.registrations).forEach(days=>{const r=days[di];if(r&&r[m[0]])n++;});const key=items.map(x=>x.name).join(' / ');if(!map[key])map[key]={label:key,emoji:m[2],img:items[0].img,val:0,meal:m[0]};map[key].val+=n;});});});return Object.values(map).sort((a,b)=>b.val-a.val);}

const CLR=['#062F6E','#0A63B0','#00AEEF','#0ea5e9','#6366f1','#8b5cf6','#d97706','#dc2626'];
function drawBars(id,rows,fmt){fmt=fmt||(v=>v);const cv=document.getElementById(id);if(!cv)return;const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);if(!rows.length){ctx.fillStyle='#94a3b8';ctx.font="500 15px 'IBM Plex Sans Thai'";ctx.textAlign='center';ctx.fillText('ไม่พบหน่วยงาน',W/2,H/2);return;}ctx.textBaseline='middle';const max=Math.max(...rows.map(r=>r.val),1),labelW=150,left=labelW,right=W-56,top=12,gap=7,bh=(H-top*2-gap*(rows.length-1))/rows.length;rows.forEach((r,i)=>{const y=top+i*(bh+gap),w=(right-left)*(r.val/max);ctx.fillStyle='#334155';ctx.textAlign='right';ctx.font="600 12px 'IBM Plex Sans Thai','Sarabun'";const lbl=r.label.replace('แผนก','').replace('หน่วย','').replace('รักษา','');ctx.fillText(lbl.length>17?lbl.slice(0,16)+'…':lbl,labelW-8,y+bh/2);ctx.fillStyle='#eef2f6';rr(ctx,left,y,right-left,bh,6);ctx.fill();ctx.fillStyle=i===0?'#062F6E':'#00AEEF';rr(ctx,left,y,Math.max(w,3),bh,6);ctx.fill();ctx.fillStyle='#0f172a';ctx.textAlign='left';ctx.font="800 13px 'IBM Plex Sans Thai'";ctx.fillText(fmt(r.val),left+w+7,y+bh/2);});}
function drawLine(id,data){const cv=document.getElementById(id);if(!cv)return;const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);ctx.textBaseline='middle';const top=22,bot=H-38,left=46,right=W-18,max=Math.max(...data.map(d=>d.val),1)*1.2;ctx.strokeStyle='#eef2f6';ctx.fillStyle='#94a3b8';ctx.textAlign='right';ctx.font="500 12px 'IBM Plex Sans Thai'";for(let i=0;i<=4;i++){const y=top+(bot-top)*i/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();ctx.fillText(Math.round(max*(1-i/4)),left-8,y);}const n=data.length,xs=data.map((_,i)=>n>1?left+(right-left)*i/(n-1):(left+right)/2),ys=data.map(d=>bot-(bot-top)*(d.val/max));const g=ctx.createLinearGradient(0,top,0,bot);g.addColorStop(0,'rgba(6,47,110,.22)');g.addColorStop(1,'rgba(6,47,110,0)');ctx.beginPath();ctx.moveTo(xs[0],bot);xs.forEach((x,i)=>ctx.lineTo(x,ys[i]));ctx.lineTo(xs[n-1],bot);ctx.closePath();ctx.fillStyle=g;ctx.fill();ctx.beginPath();ctx.moveTo(xs[0],ys[0]);for(let i=1;i<n;i++)ctx.lineTo(xs[i],ys[i]);ctx.strokeStyle='#062F6E';ctx.lineWidth=3;ctx.stroke();ctx.textAlign='center';data.forEach((d,i)=>{ctx.beginPath();ctx.arc(xs[i],ys[i],5,0,7);ctx.fillStyle='#062F6E';ctx.fill();ctx.fillStyle='#0f172a';ctx.font="800 13px 'IBM Plex Sans Thai'";ctx.fillText(d.val,xs[i],ys[i]-15);ctx.fillStyle='#64748b';ctx.font="500 12px 'IBM Plex Sans Thai'";ctx.fillText(d.label,xs[i],bot+19);});}
function rr(ctx,x,y,w,h,r){r=Math.min(r,h/2,w/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function renderAdminData(){const rows=aggPerson();body().innerHTML=`<div class="hint">💡 กดปุ่มแล้วเลือกได้เลยว่าจะ <b>บันทึกลงเครื่อง 💾</b> หรือ <b>แชร์ไปไลน์/อีเมล 📤</b> · ไฟล์ .csv เปิดใน Microsoft Excel ได้ รองรับภาษาไทย</div>
  <button class="btn btn-brand" onclick="exportCSV()">📤 ไฟล์การลงทะเบียนรอบนี้ (Excel)</button>
  <button class="btn btn-ghost" style="margin-top:10px" onclick="exportNoReg()">🚫 รายชื่อคนไม่ลงทะเบียน (รอบที่ปิดแล้ว)</button>
  <button class="btn btn-ghost" style="margin-top:10px" onclick="exportFeedback()">💬 แชร์ข้อเสนอแนะ (${feedbackAll().length} รายการ)</button>
  <div class="card" style="margin-top:12px"><div class="sec-title">สรุปการลงทะเบียนรายคน<span class="cap">${rows.length} คน</span></div><div class="search-wrap"><span class="ic">🔍</span><input placeholder="ค้นหาชื่อ/รหัส/แผนก" oninput="filterData(this.value)"></div><div id="dbox">${personRows(rows.slice(0,20))}</div></div>`;}
function filterData(q){q=(q||'').toLowerCase();const rows=aggPerson().filter(({e})=>e.code.includes(q)||e.name.toLowerCase().includes(q)||e.dept.toLowerCase().includes(q)||e.unit.toLowerCase().includes(q)).slice(0,30);document.getElementById('dbox').innerHTML=personRows(rows);}
function exportCSV(){const head=['รหัสพนักงาน','ชื่อ-นามสกุล','หน่วยงาน','หน่วย','วันที่','คาบ','เมนู','สถานะ'];const lines=[head.join(',')];employees.forEach(e=>{const days=registrations[e.code]||{};menuDays.forEach((day,di)=>{const d=thDateISO(day.dateISO),r=days[di];availMealsFor(e,di).forEach(m=>{const status=!r?'ยังไม่ลงทะเบียน':(r[m[0]]?'ทาน':'ไม่ทาน');const menu=(day.meals[m[0]]||[]).map(x=>x.name).join(' / ');lines.push([e.code,e.name,e.dept,e.unit,`${d.dow} ${d.short}`,m[1],menu,status].map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','));});});});askExport('canteen-register.csv',lines,'ไฟล์การลงทะเบียน');}


/* รายชื่อพนักงานที่ "ไม่ได้ลงทะเบียนเลย" แยกตามรอบ (รอบปัจจุบัน + รอบย้อนหลังทั้งหมด) */
function roundLabel(ds){const days=(ds&&ds.menuDays)||[];if(!days.length)return '-';const a=thDateISO(days[0].dateISO),b=thDateISO(days[days.length-1].dateISO);return days.length>1?(a.short+' – '+b.short):a.short;}
function noRegRows(list){const lines=[['รอบ','รหัสพนักงาน','ชื่อพนักงาน','หน่วยงาน'].join(',')];let total=0;
  list.forEach(function(ds){const lbl=roundLabel(ds);const regs=ds.registrations||{};
    employees.forEach(function(e){const days=regs[e.code]||{};let n=0;
      Object.values(days).forEach(function(r){MEALS.forEach(function(m){if(m[0] in r)n++;});});
      /* นับเป็น 1 คนต่อ 1 รอบ ไม่แยกวัน/คาบ — ไม่ลงเลยทั้งรอบเท่านั้นจึงนับ */
      if(n===0){total++;lines.push([lbl,e.code,e.name,e.dept||e.unit||''].map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(','));}});});
  return{lines:lines,total:total};}

function gridFor(list,meals){const showTot=meals.length>1;let h='<table class="grid"><thead><tr><th>วัน / คาบ</th>'+meals.map(m=>`<th>${m[2]}<br>${m[1].replace('คาบ','')}</th>`).join('')+(showTot?'<th>รวม</th>':'')+'</tr></thead><tbody>';menuDays.forEach((day,di)=>{const d=thDateISO(day.dateISO);let rt=0;h+=`<tr><td class="dcell">${d.dow.slice(0,2)} ${d.short}</td>`;meals.forEach(m=>{const e=cellEat(list,di,m[0]);rt+=e;h+=`<td class="ncell">${e}</td>`;});h+=(showTot?`<td class="tcell">${rt}</td>`:'')+'</tr>';});h+='<tr class="totrow"><td>รวมทุกวัน</td>';let gt=0;meals.forEach(m=>{let c=0;menuDays.forEach((_,di)=>c+=cellEat(list,di,m[0]));gt+=c;h+=`<td>${c}</td>`;});h+=(showTot?`<td>${gt}</td>`:'')+'</tr></tbody></table>';return h;}
function shareGrid(kind,act){const isDaily=kind==='daily';const list=isDaily?DAILY_EMPS:REG_EMPS;const M=isDaily?MEALS.filter(m=>m[0]==='lunch'):MEALS;const showTot=M.length>1;const heading=isDaily?'ผู้ลงทะเบียนทาน · พนักงานรายวัน (ระดับ 3)':'ผู้ลงทะเบียนทาน · พนักงานระดับ 4+';const D=menuDays,pad=36,firstW=180,colW=150,rowH=60,headH=160,footH=54;const cols=M.length+(showTot?1:0);const tableW=pad*2+firstW+colW*cols;const H=headH+rowH*(D.length+1)+footH;const cv=document.createElement('canvas');const x=cv.getContext('2d');x.font="800 25px 'IBM Plex Sans Thai','Sarabun',sans-serif";const _tW=x.measureText('โรงครัวมิตรลาว · '+heading).width;x.font="500 16px 'IBM Plex Sans Thai',sans-serif";const _sW=x.measureText(periodLabel()+'   ·   ตัวเลข = จำนวนคน (ที่จะมาทาน)').width;const W=Math.max(tableW,Math.ceil(_tW)+pad*2,Math.ceil(_sW)+pad*2);cv.width=W;cv.height=H;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#062F6E';x.fillRect(0,0,W,100);x.textBaseline='middle';x.textAlign='left';x.fillStyle='#fff';x.font="800 25px 'IBM Plex Sans Thai','Sarabun',sans-serif";x.fillText('โรงครัวมิตรลาว · '+heading,pad,42);x.font="500 16px 'IBM Plex Sans Thai',sans-serif";x.fillStyle='#cfe9fb';x.fillText(periodLabel()+'   ·   ตัวเลข = จำนวนคน (ที่จะมาทาน)',pad,76);const ty=headH,colX=i=>i===0?pad:pad+firstW+colW*(i-1),colWi=i=>i===0?firstW:colW,heads=['วัน / คาบ',...M.map(m=>m[1].replace('คาบ','')),...(showTot?['รวม']:[])];x.textAlign='center';for(let i=0;i<heads.length;i++){x.fillStyle='#0A63B0';x.fillRect(colX(i),ty-rowH,colWi(i),rowH);x.strokeStyle='#fff';x.lineWidth=1;x.strokeRect(colX(i),ty-rowH,colWi(i),rowH);x.fillStyle='#fff';x.font="700 17px 'IBM Plex Sans Thai',sans-serif";x.fillText(heads[i],colX(i)+colWi(i)/2,ty-rowH/2);}D.forEach((day,di)=>{const d=thDateISO(day.dateISO),ry=ty+di*rowH;let rt=0;x.fillStyle=di%2?'#f8fafc':'#fff';x.fillRect(pad,ry,tableW-pad*2,rowH);x.fillStyle='#0f172a';x.textAlign='left';x.font="700 16px 'IBM Plex Sans Thai',sans-serif";x.fillText(d.dow+' '+d.short,colX(0)+12,ry+rowH/2);x.textAlign='center';M.forEach((m,mi)=>{const e=cellEat(list,di,m[0]);rt+=e;x.strokeStyle='#e2e8f0';x.strokeRect(colX(mi+1),ry,colW,rowH);x.fillStyle='#062F6E';x.font="800 24px 'IBM Plex Sans Thai',sans-serif";x.fillText(e,colX(mi+1)+colW/2,ry+rowH/2);});if(showTot){const tcx=colX(M.length+1);x.fillStyle='#fef3c7';x.fillRect(tcx,ry,colW,rowH);x.strokeStyle='#fcd34d';x.strokeRect(tcx,ry,colW,rowH);x.fillStyle='#b45309';x.font="800 24px 'IBM Plex Sans Thai',sans-serif";x.fillText(rt,tcx+colW/2,ry+rowH/2);}x.strokeStyle='#e2e8f0';x.strokeRect(colX(0),ry,firstW,rowH);});const ry=ty+D.length*rowH;x.fillStyle='#dbeafe';x.fillRect(pad,ry,tableW-pad*2,rowH);x.fillStyle='#062F6E';x.textAlign='left';x.font="800 16px 'IBM Plex Sans Thai',sans-serif";x.fillText('รวมทุกวัน',colX(0)+12,ry+rowH/2);x.textAlign='center';let gt=0;M.forEach((m,mi)=>{let c=0;D.forEach((_,di)=>c+=cellEat(list,di,m[0]));gt+=c;x.strokeStyle='#93c5fd';x.strokeRect(colX(mi+1),ry,colW,rowH);x.fillStyle='#062F6E';x.font="800 24px 'IBM Plex Sans Thai',sans-serif";x.fillText(c,colX(mi+1)+colW/2,ry+rowH/2);});if(showTot){const t2=colX(M.length+1);x.fillStyle='#062F6E';x.fillRect(t2,ry,colW,rowH);x.strokeStyle='#93c5fd';x.strokeRect(t2,ry,colW,rowH);x.fillStyle='#fff';x.font="800 24px 'IBM Plex Sans Thai',sans-serif";x.fillText(gt,t2+colW/2,ry+rowH/2);}x.fillStyle='#64748b';x.textAlign='left';x.font="500 13px 'IBM Plex Sans Thai',sans-serif";x.fillText('อัปเดต: '+nowStr()+'   ·   จากแอปลงทะเบียนอาหารโรงครัว',pad,H-28);outputCanvas(cv,act);}
function shareCanvas(cv){cv.toBlob(async function(blob){const file=new File([blob],'canteen-summary.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'สรุปผู้ลงทะเบียนทานอาหาร',text:'โรงครัวมิตรลาว · '+periodLabel()});toast('เปิดเมนูแชร์แล้ว 📤');return;}}catch(e){if(e&&e.name==='AbortError')return;}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='canteen-summary.png';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('บันทึกภาพแล้ว (อุปกรณ์นี้แชร์ตรงไม่ได้)');},'image/png');}
/* บันทึกเป็นไฟล์ JPG ลงเครื่องโดยตรง */
function imgStamp(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());}
function saveCanvasJpg(cv){cv.toBlob(function(blob){if(!blob){toast('บันทึกไม่สำเร็จ');return;}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='canteen-'+imgStamp()+'.jpg';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('บันทึกภาพ JPG แล้ว 💾');},'image/jpeg',0.95);}
function outputCanvas(cv,act){if(act==='save')saveCanvasJpg(cv);else shareCanvas(cv);}
